  /api/v1/market-data/instruments/{instrumentId}/history/candles/{direction}/{interval}/{candlesCount}:
    get:
      tags:
      - Market Data
      summary: Get instrument candle history
      description: '**Rate limit:** 120 requests per 60 seconds. This is a **shared quota** — the same budget is consumed by a group of related endpoints, so calling any of them reduces what is left for the others (you cannot call each at the full rate independently). Endpoints sharing this quota:

        - `GET /api/v1/market-data/exchanges`

        - `GET /api/v1/market-data/instrument-types`

        - `GET /api/v1/market-data/instruments`

        - `GET /api/v1/market-data/instruments/history/closing-price`

        - `GET /api/v1/market-data/instruments/rates`

        - `GET /api/v1/market-data/search`

        - `GET /api/v1/market-data/stocks-industries`

        - `GET /api/v2/market-data/instruments`

        - `GET /api/v2/market-data/instruments/search`

        - `GET /api/v2/market-data/rates`


        ---


        Retrieves historical price data in OHLCV (Open, High, Low, Close, Volume) format for a specified instrument. The data is organized into time-based candles of various intervals, from one minute to one week.'
      operationId: getMarketDataInstrumentsByInstrumentIdHistoryCandlesByDirectionByIntervalByCandlesCount
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 2858d1e7-92e3-4ed4-aa1d-240eb030720f
        description: A unique request identifier.
        example: 2858d1e7-92e3-4ed4-aa1d-240eb030720f
      - name: direction
        in: path
        description: Sorting direction of the candles data. Use 'asc' for oldest to newest, or 'desc' for newest to oldest.
        required: true
        schema:
          type: string
