          items:
            $ref: '#/components/schemas/instrument'
        pagination:
          $ref: '#/components/schemas/pagination'
    searchInstrumentsResponse:
      type: object
      description: 'Free-text instrument search results. Note: unlike /instruments, this endpoint wraps results under a `results` key rather than `instruments` -- a genuine naming inconsistency between the two upstream endpoints, documented as-is rather than normalized here since neither endpoint is owned by this gateway.'
