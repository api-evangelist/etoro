        - GET /api/v1/market-data/instruments
        - GET /api/v1/market-data/instruments/history/closing-price
        - GET /api/v1/market-data/instruments/rates
        - GET /api/v1/market-data/instruments/{instrumentId}/history/candles/{direction}/{interval}/{candlesCount}
        - GET /api/v1/market-data/search
        - GET /api/v1/market-data/stocks-industries
        - GET /api/v2/market-data/instruments
        - GET /api/v2/market-data/rates
  /api/v2/market-data/rates:
    get:
      tags:
      - Market Data
      summary: Retrieve bid/ask rates for one or more instruments
      description: '**Rate limit:** 120 requests per 60 seconds. This is a **shared quota** — the same budget is consumed by a group of related endpoints, so calling any of them reduces what is left for the others (you cannot call each at the full rate independently). Endpoints sharing this quota:

        - `GET /api/v1/market-data/exchanges`

        - `GET /api/v1/market-data/instrument-types`

        - `GET /api/v1/market-data/instruments`

        - `GET /api/v1/market-data/instruments/history/closing-price`

        - `GET /api/v1/market-data/instruments/rates`

        - `GET /api/v1/market-data/instruments/{instrumentId}/history/candles/{direction}/{interval}/{candlesCount}`

        - `GET /api/v1/market-data/search`

        - `GET /api/v1/market-data/stocks-industries`

        - `GET /api/v2/market-data/instruments`

        - `GET /api/v2/market-data/instruments/search`


        ---


        Returns current bid/ask rates keyed by instrument ID. Each rate carries a `quoteType` indicating whether it is `realtime` or `delayed`.


        Returns 200 when all requested instruments are found, 206 when only a subset is available.'
      operationId: getRates
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 28c40b78-58a8-431e-b81b-3c2754b08f15
        description: A unique request identifier.
        example: 28c40b78-58a8-431e-b81b-3c2754b08f15
      - name: instrumentIds
        in: query
        description: List of instrument IDs to fetch rates for (max 1000).
        required: true
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
          maxItems: 1000
      responses:
        '200':
          description: Rates for all requested instruments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ratesResponse'
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 11 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 120
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 120;w=60
        '206':
          description: Rates for a subset of the requested instruments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ratesResponse'
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 11 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 120
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 120;w=60
        '400':
          description: Invalid request parameters
        '401':
          description: Bad or missing API key. Rejected by the gateway before the request reaches this service; uses the gateway error envelope (errorCode/errorMessage), not this route's apiErrorEnvelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayErrorEnvelope'
        '404':
          description: Could not retrieve data for any instrument id
        '422':
          description: 'Missing X-Request-Id header (errorCode: RequestIdRequired). Rejected by the gateway before the request reaches this service; uses the gateway error envelope (errorCode/errorMessage), not this route''s apiErrorEnvelope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gatewayErrorEnvelope'
        '500':
          description: Internal server error
        '429':
          description: Too Many Requests — the shared rate limit (120 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 11 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 120
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 120;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:real:read
      - oauth2:
        - etoro-public:demo:read
      - oauth2:
        - etoro-public:real:write
      - oauth2:
        - etoro-public:demo:write
      - oauth2:
        - etoro-public:market-data:read
      x-ratelimit:
        limit: 120
        window: 60
        shared: true
        defaultPool: false
        sharedWith:
        - GET /api/v1/market-data/exchanges
        - GET /api/v1/market-data/instrument-types
        - GET /api/v1/market-data/instruments
        - GET /api/v1/market-data/instruments/history/closing-price
        - GET /api/v1/market-data/instruments/rates
        - GET /api/v1/market-data/instruments/{instrumentId}/history/candles/{direction}/{interval}/{candlesCount}
        - GET /api/v1/market-data/search
        - GET /api/v1/market-data/stocks-industries
        - GET /api/v2/market-data/instruments
        - GET /api/v2/market-data/instruments/search
components:
  schemas:
    apiErrorEnvelope:
      type: object
      description: Error envelope
      properties:
        success:
          type: boolean
          description: Always false for error responses.
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
    gatewayErrorEnvelope:
      type: object
      description: Error envelope used for gateway-level rejections (bad/missing API key -> 401, missing X-Request-Id -> 422) that occur before the request reaches this service. Unlike apiErrorEnvelope, this shape is {errorCode, errorMessage} with no success/error wrapper.
      properties:
        errorCode:
          type: string
          description: Machine-readable error code, e.g. Unauthorized, RequestIdRequired
        errorMessage:
          type: string
          description: Human-readable error message
    instrumentImage:
      type:
      - object
      - 'null'
      description: Best available image for the instrument. backgroundColor is included only for SVG images.
      properties:
        uri:
          type: string
          description: Image URI
        backgroundColor:
          type:
          - string
          - 'null'
          description: Background color, included only for SVG images
    instrument:
      type: object
      description: Instrument (security) metadata
      properties:
        instrumentId:
          type: integer
          description: Unique instrument identifier
        displayName:
          type: string
          description: Human-readable display name
        type:
          type: string
          description: Instrument type (e.g. Stocks, ETF, Crypto)
        symbol:
          type: string
          description: Trading symbol (e.g. AAPL)
        exchangeId:
          type: integer
          description: Exchange the instrument is listed on
        multiplier:
          type:
          - number
          - 'null'
          format: double
          description: Contract multiplier, relevant for futures and options
        lastTradingDateTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Last trading date/time, relevant for options and futures
        expirationDateTime:
          type:
          - string
          - 'null'
          format: date-time
          description: Expiration date/time, relevant for options and futures
        image:
          $ref: '#/components/schemas/instrumentImage'
    ratesResponse:
      type: object
      description: Rates for the requested instruments.
      properties:
        results:
          type: array
          description: Rates for the requested instruments, in request order.
          items:
            $ref: '#/components/schemas/rate'
    LiveRatesResponse:
      type: object
      description: Container for real-time market rates data
      properties:
        rates:
          type: array
          description: Array of current market rates for requested instruments
          items:
            type: object
            description: Individual instrument rate information
            properties:
              instrumentID:
                type: integer
                description: Unique identifier for the financial instrument
              ask:
                type: number
                format: float
                description: Current asking price (offer) for the instrument. This is the price at which you can buy the asset.
              bid:
                type: number
                format: float
                description: Current bid price for the instrument. This is the price at which you can sell the asset.
              lastExecution:
                type: number
                format: float
                description: Price of the most recent trade execution for this instrument
              conversionRateAsk:
                type: number
                format: float
                description: Current conversion rate (ask) from instrument's currency to USD, used for position value calculations
              conversionRateBid:
                type: number
                format: float
                description: Current conversion rate (bid) from instrument's currency to USD, used for position value calculations
              date:
                type: string
                format: date-time
                description: The date-time of the price in the system
              unitMargin:
                type: number
                format: float
                description: (Obsolete) USD equivalent of the instrument price
              unitMarginAsk:
                type: number
                format: float
                description: (Obsolete) USD equivalent of the instrument ask price
              unitMarginBid:
                type: number
                format: float
                description: (Obsolete) USD equivalent of the instrument bid price
              priceRateID:
                type: integer
              bidDiscounted:
                type: number
                format: float
                description: Obsolete
              askDiscounted:
                type: number
                format: float
                description: Obsolete
              unitMarginBidDiscounted:
                type: number
                format: float
                description: Obsolete
              unitMarginAskDiscounted:
                type: number
                format: float
                description: Obsolete
    pagination:
      type: object
      description: Cursor-based pagination metadata
      properties:
        hasNext:
          type: boolean
          description: Whether additional results exist
        nextPageToken:
          type:
          - string
          - 'null'
          description: Pass as the pageToken parameter to retrieve the next page
        pageSize:
          type:
          - integer
          - 'null'
          description: The page size used for this request. Reflects the default (100) when the pageSize parameter was omitted.
    candlesResponse:
      type: object
      description: Response containing historical price data in candlestick format
      properties:
        interval:
          type: string
          description: Time interval of the returned candles. Matches the interval parameter from the request.
          enum:
          - OneMinute
          - FiveMinutes
          - TenMinutes
          - FifteenMinutes
          - ThirtyMinutes
          - OneHour
          - FourHours
          - OneDay
          - OneWeek
        candles:
          type: array
          description: List of candle data grouped by instrument
          items:
            type: object
            description: Candle data for a specific instrument
            properties:
              instrumentId:
                type: integer
                description: Identifier of the instrument these candles belong to
              candles:
                type: array
                description: List of individual candles representing price action over time
                items:
                  type: object
                  description: Individual candle data point
                  properties:
                    instrumentID:
                      type: integer
                      description: Identifier of the instrument this candle belongs to
                    fromDate:
                      type: string
                      format: date-time
                      description: Start time of the candle period in ISO 8601 format
                    open:
                      type: number
                      format: float
                      description: Opening price at the start of the candle period
                    high:
                      type: number
                      format: float
                      description: Highest price reached during the candle period
                    low:
                      type: number
                      format: float
                      description: Lowest price reached during the candle period
                    close:
                      type: number
                      format: float
                      description: Closing price at the end of the candle period
                    volume:
                      type: number
                      format: float
                      description: Trading volume during the candle period
              rangeOpen:
                type: number
                format: float
                description: Opening price of the first candle in the range
              rangeClose:
                type: number
                format: float
                description: Closing price of the last candle in the range
              rangeHigh:
                type: number
                format: float
                description: Highest price across all candles in the range
              rangeLow:
                type: number
                format: float
                description: Lowest price across all candles in the range
              volume:
                type: number
                format: float
                description: Total trading volume across all candles in the range
    closingPricesResponse:
      type: array
      description: List of closing prices for all instruments
      items:
        type: object
        description: Closing price information for a specific instrument
        properties:
          instrumentId:
            type: integer
            description: Unique identifier of the instrument
          officialClosingPrice:
            type: number
            format: float
            description: Most recent official closing price for the instrument
          isMarketOpen:
            type: boolean
            description: Obsolete - Do not use
          closingPrices:
            type: object
            description: Historical closing prices at different time intervals
            properties:
              daily:
                type: object
                description: Official closing price from the previous trading day
                properties:
                  price:
                    type: number
                    format: float
                    description: Closing price value
                  date:
                    type: string
                    format: date-time
                    description: Date and time of the closing price in ISO 8601 format
              weekly:
                type: object
                description: Official closing price from the previous trading week
                properties:
                  price:
                    type: number
                    format: float
                    description: Closing price value
                  date:
                    type: string
                    format: date-time
                    description: Date and time of the closing price in ISO 8601 format
              monthly:
                type: object
                description: Official closing price from the previous trading month
                properties:
                  price:
                    type: number
                    format: float
                    description: Closing price value. A value of -1 indicates no data available.
                  date:
                    type: string
                    format: date-time
                    description: Date and time of the closing price in ISO 8601 format. Default date (0001-01-01) indicates no data available.
    StocksIndustriesResponse:
      type: object
      properties:
        stocksIndustries:
          type: array
          items:
            type: object
            properties:
              industryID:
                type: integer
              industryName:
                type: string
    InstrumentsResponse:
      type: object
      properties:
        instrumentDisplayDatas:
          type: array
          items:
            type: object
            properties:
              instrumentID:
                type: integer
              instrumentDisplayName:
                type: string
              instrumentTypeID:
                type: integer
              exchangeID:
                type: integer
              symbolFull:
                type: string
              stocksIndustryId:
                type: integer
              priceSource:
                type: string
                description: The data provider or market source for the price, such as Nasdaq, LSE, or CME.
              hasExpirationDate:
                type: boolean
              isInternalInstrument:
                type: boolean
                description: If set to true, the instrument is restricted from public access.
              images:
                type: array
                items:
                  type: object
                  properties:
                    instrumentID:
                      type: integer
                    width:
                      type: number
                    height:
                      type: number
                    uri:
                      type: string
                    backgroundColor:
                      type: string
                    textColor:
                      type: string
    Instrument:
      type: object
      properties:
        instrumentId:
          type: integer
          description: A unique identifier for the instrument.
        displayname:
          type: string
          description: The display name of the instrument.
        popularityUniques7Day:
          type: integer
          description: The number of unique users who viewed this instrument in the last 7 days.
        instrumentTypeID:
          type: integer
