  /api/v1/balances/{accountType}/{accountId}/history:
    get:
      tags:
      - Balances
      summary: Get account balance history
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns end-of-day balance snapshots for a specific account identified by type and account ID for the authenticated user. History is available for the last 12 months. The maximum date range per request is 365 days.'
      operationId: getHistoricalBalanceByAccount
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: d6f27c7c-5704-4f6f-a1e2-97673842a9d8
        description: A unique request identifier.
        example: d6f27c7c-5704-4f6f-a1e2-97673842a9d8
      - name: accountType
        in: path
        required: true
        description: The account type. Must be lowercase — any other casing does not match the route and returns 404.
        schema:
          $ref: '#/components/schemas/AccountTypePathParam'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the account.
        schema:
          type: string
      - name: displayCurrency
        in: query
        description: ISO 4217 currency code for totals and conversions. Defaults to USD.
        schema:
          type: string
          default: USD
      - name: fromDate
        in: query
        description: 'Start of the date range (inclusive). Format: YYYY-MM-DD (ISO 8601). Defaults to toDate minus 30 days. Must be within the last 12 months. Maximum range with toDate: 365 days.'
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        description: 'End of the date range (inclusive). Format: YYYY-MM-DD (ISO 8601). Defaults to today (UTC). Maximum range with fromDate: 365 days.'
        schema:
          type: string
          format: date
      - name: includeSubAccounts
        in: query
        description: Whether to also include the user's qualifying sub-accounts in the aggregated history. Their end-of-day snapshots are merged by date with the primary account's and the daily totals are recalculated across all accounts. Only effective when the accountType path segment is trading; ignored for every other account type. Defaults to false.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Historical balance snapshots for the specified account retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHistoricalBalancesResponse'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad Request — invalid account type, account ID, or date range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesErrorResponse'
        '401':
          description: Unauthorized — missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden — the token does not include the etoro-public:money.balance:read scope.
        '404':
          description: Not Found — no account or historical data found for the specified parameters.
        '429':
          description: Too Many Requests — rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
        '502':
          description: Bad Gateway — the historical balance archive is unavailable. No snapshots could be read; do not treat this as an empty history. Safe to retry.
          content:
