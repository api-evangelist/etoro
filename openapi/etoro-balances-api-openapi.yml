  /api/v1/balances/{accountType}/{accountId}:
    get:
      tags:
      - Balances
      summary: Get balance for a specific account
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns the balance for a specific account identified by type and account ID for the authenticated user. Zero-balance accounts are always returned by this endpoint, so a 404 means the account does not exist rather than that its balance is zero.


        Important: totalBalance and displayBalance are portfolio value, not spendable cash. For Trading, Options, MoneyFarm, Spaceship and Plaee they represent total account value including invested positions; for Crypto, the fiat value of holdings. Only for Cash accounts do they equal available cash. Do not use them to decide whether a trade or withdrawal is affordable — request expand=equityDetails and read equityDetails.available (Trading, Options, MoneyFarm, Cash, Plaee) or equityDetails.spendableBalanceInFiat (Crypto). Spaceship accounts expose no spendable figure. Note that equityDetails amounts are denominated in each account''s own native currency, not in displayCurrency, so they must be converted before being compared with displayBalance or totalBalance.'
      operationId: getBalanceByAccount
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 985667d9-4cd7-40fa-bad4-a2a3b27a513b
        description: A unique request identifier.
        example: 985667d9-4cd7-40fa-bad4-a2a3b27a513b
      - name: accountType
        in: path
        required: true
        description: The account type. Must be lowercase — any other casing does not match the route and returns 404.
        schema:
          $ref: '#/components/schemas/AccountTypePathParam'
      - name: accountId
        in: path
        required: true
        description: The unique identifier of the account.
        schema:
          type: string
      - name: displayCurrency
        in: query
        description: ISO 4217 currency code for totals and conversions. Defaults to USD.
        schema:
          type: string
          default: USD
      - name: expand
        in: query
        description: 'Comma-separated list of optional sections to include in the response. Valid values: equityDetails.'
        schema:
          type: string
      responses:
        '200':
          description: Balance for the specified account retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBalancesResponse'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad Request — invalid account type or account ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesErrorResponse'
        '401':
          description: Unauthorized — missing or invalid authentication credentials.
          content:
            application/json:
              schema:
