components:
  schemas:
    HistoricalAccountData:
      type: object
      description: Individual account balance within a historical daily snapshot.
      properties:
        accountId:
          type:
          - string
          - 'null'
          description: Unique identifier of the account.
        accountType:
          $ref: '#/components/schemas/BalanceAggregatorApi_AccountType'
        currency:
          type:
          - string
          - 'null'
          description: The account's native currency (ISO 4217).
        cash:
          type: number
          format: double
          description: Cash balance in the account's native currency.
        investedAmount:
          type: number
          format: double
          description: Invested amount in the account's native currency.
        pnl:
          type: number
          format: double
          description: Profit and loss in the account's native currency.
        total:
          type: number
          format: double
          description: Total balance in the account's native currency.
        usdRate:
          type: number
          format: double
          description: Exchange rate to USD.
        displayCash:
          type: number
          format: double
          description: Cash balance converted to the requested display currency.
        displayInvestedAmount:
          type: number
          format: double
          description: Invested amount converted to the requested display currency.
        displayPnl:
          type: number
          format: double
          description: Profit and loss converted to the requested display currency.
        displayTotal:
          type: number
          format: double
          description: Total balance converted to the requested display currency.
        exchangeRate:
          type: number
          format: double
          description: Exchange rate applied to convert to displayCurrency.
      additionalProperties: false
    AccountBalanceData:
      type: object
      description: Balance data for a single account.
      properties:
        accountId:
          type:
          - string
          - 'null'
          description: Unique identifier of the account.
        accountType:
          $ref: '#/components/schemas/BalanceAggregatorApi_AccountType'
        subType:
          type:
          - string
          - 'null'
          description: Account sub-type, where applicable.
        balance:
          type: number
          format: double
          description: 'Account balance in the account''s native currency (see the currency field). Its meaning depends on accountType: total account value including invested positions for Trading, Options, MoneyFarm, Spaceship and Plaee (for Plaee: cash plus the mark-to-market value of open prediction-market positions); holdings in native crypto units for Crypto; available cash for Cash. For Trading it equals equityDetails.available + equityDetails.totalUsedMargin + equityDetails.currentPNL. Not a spendable amount except on Cash accounts — see equityDetails.available.'
        currency:
          type:
          - string
          - 'null'
          description: The account's native currency (ISO 4217).
        displayBalance:
          type: number
          format: double
          description: Account balance converted to the requested display currency. Carries the same per-accountType meaning as balance, and is likewise not a spendable amount except on Cash accounts.
        displayCurrency:
          type:
          - string
          - 'null'
          description: The display currency (ISO 4217) used for displayBalance.
        exchangeRate:
          type: number
          format: double
          description: Exchange rate applied to convert balance to displayCurrency.
        equityDetails:
          $ref: '#/components/schemas/EquityDetailsData'
      additionalProperties: false
    BalanceAggregatorApi_AccountType:
      type: string
      description: The type of eToro account, as returned in response bodies.
      enum:
      - Trading
      - Cash
      - Options
      - Crypto
      - MoneyFarm
      - Spaceship
      - Plaee
    HistoricalDailySnapshotData:
      type: object
      description: End-of-day balance snapshot for a specific date.
      properties:
        date:
          type: string
          format: date
          description: The snapshot date (ISO 8601).
        totalCurrencyIso:
          type:
          - string
          - 'null'
          description: ISO 4217 currency code for the total figures in native currency.
        totalCash:
          type: number
          format: double
          description: Total cash across all accounts in native currency.
        totalInvestedAmount:
          type: number
          format: double
          description: Total invested amount across all accounts in native currency.
        totalPnl:
          type: number
          format: double
          description: Total profit and loss across all accounts in native currency.
        totalBalance:
          type: number
          format: double
          description: Total end-of-day equity across all accounts in native currency, as recorded in the snapshot. Reported independently of totalCash, totalInvestedAmount and totalPnl — do not assume it is their exact sum. This is a historical equity figure, not available cash, and not a current balance.
        displayTotalCash:
          type: number
          format: double
          description: Total cash converted to the requested display currency.
        displayTotalInvestedAmount:
          type: number
          format: double
          description: Total invested amount converted to the requested display currency.
        displayTotalPnl:
          type: number
          format: double
          description: Total profit and loss converted to the requested display currency.
        displayTotalBalance:
          type: number
          format: double
          description: Total end-of-day equity converted to the requested display currency. This is a historical equity figure, not available cash, and not a current balance.
        totalExchangeRate:
          type: number
          format: double
          description: Exchange rate applied to convert totals to displayCurrency.
        accountSnapshots:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HistoricalAccountData'
          description: Individual account breakdowns within this snapshot.
      additionalProperties: false
    BalancesErrorResponse:
      type: object
      description: Error response returned for client-side errors (4xx).
      properties:
        code:
          type:
          - string
          - 'null'
          description: Error code (e.g., VALIDATION_ERROR, USER_NOT_FOUND).
        message:
          type:
          - string
          - 'null'
          description: Human-readable error message.
        requestId:
          type:
          - string
          - 'null'
          description: Request ID for tracing and support.
      additionalProperties: false
    EquityDetailsData:
      type: object
      description: 'Provider-specific balance details, returned only when the request includes expand=equityDetails. All fields are nullable; only fields relevant to the account''s provider are populated. Trading accounts populate available/frozenCash/currentPNL/totalUsedMargin; Crypto accounts populate cryptoId, the balance variants, fiatConversionCurrency, and orderIndex; Spaceship accounts return no equityDetails object at all; Plaee accounts populate available (withdrawable cash), frozenCash (cash reserved by resting prediction-market orders), currentPNL (unrealised profit and loss on open positions), balance (cash) and totalBalance (cash plus open positions), all in the account currency, plus hasOpenPositions (true when an open position or a resting order exists at Plaee). Currency: the fiat amounts here are denominated in the enclosing account''s native currency (its currency field), not in displayCurrency — the object carries no currency marker of its own. The exception is the *InFiat crypto fields, which use fiatConversionCurrency.'
      properties:
        available:
          type:
          - number
          - 'null'
          format: double
          description: 'Funds available to trade or withdraw (buying power). This is the correct field for pre-trade affordability checks — use it instead of totalBalance or displayBalance. IMPORTANT: this value is denominated in the account''s native currency (the sibling currency field), NOT in displayCurrency, and no currency is stated inside equityDetails itself. Convert it before comparing against displayBalance, totalBalance, or any amount in the display currency — for example a GBP Cash account reports available in GBP while displayBalance is in USD. Populated for Trading, Options, MoneyFarm, Cash and Plaee (where it is the withdrawable cash) only; for Crypto use spendableBalanceInFiat instead, and Spaceship accounts return no equityDetails at all. For Cash accounts this equals the account''s balance.'
        frozenCash:
          type:
          - number
          - 'null'
          format: double
          description: Cash frozen by the platform pending settlement. Already accounted for within the other figures — do not add it to balance, which is available + totalUsedMargin + currentPNL (Trading). For Plaee accounts this is the cash reserved by resting prediction-market orders.
        currentPNL:
          type:
          - number
          - 'null'
          format: double
          description: Current unrealized profit and loss on open positions (Trading, Plaee).
        totalUsedMargin:
          type:
          - number
          - 'null'
          format: double
          description: Total margin used by open positions (Trading).
        cryptoId:
          type:
          - integer
          - 'null'
          format: int32
          description: eToro internal crypto asset identifier (Crypto).
        balance:
          type:
          - number
          - 'null'
          format: double
          description: Balance in native crypto units (Crypto); cash in the account currency (Plaee).
        totalBalance:
          type:
          - number
          - 'null'
          format: double
          description: Total balance in native crypto units, including pending (Crypto); cash plus open positions (Plaee).
        spendableBalance:
          type:
          - number
          - 'null'
          format: double
          description: Spendable balance in native crypto units — not a currency amount. Use spendableBalanceInFiat for a value comparable to other accounts (Crypto).
        balanceInFiat:
          type:
          - number
          - 'null'
          format: double
          description: Balance converted to fiat (Crypto).
        totalBalanceInFiat:
          type:
          - number
          - 'null'
          format: double
          description: Total balance converted to fiat, including pending (Crypto).
        spendableBalanceInFiat:
          type:
          - number
          - 'null'
          format: double
          description: Spendable balance converted to fiat, in fiatConversionCurrency. This is the correct field for affordability checks on Crypto accounts — the available field is not populated for Crypto (Crypto).
        fiatConversionCurrency:
          type:
          - string
          - 'null'
          description: ISO 4217 currency code used for the InFiat values (Crypto).
        hasOpenPositions:
          type:
          - boolean
          - 'null'
          description: 'Plaee only: true when the user has something open at Plaee - an open prediction-market position or a resting order - and false when nothing is open. Absent when Plaee did not report it. Read this to decide whether to show an "open positions" state; the amounts cannot tell (a position can be worth 0).'
        orderIndex:
          type:
          - integer
          - 'null'
          format: int32
          description: Display order index for sorting (Crypto).
      additionalProperties: false
    GetBalancesResponse:
      type: object
      description: Aggregated balances for the authenticated user.
      properties:
        gcid:
          type: integer
          format: int64
          description: The user's global customer ID.
        totalBalance:
          type: number
          format: double
          description: 'Sum of every included account''s balance, converted to the requested display currency. Treat this as portfolio value, not spendable cash: for Trading, Options, MoneyFarm, Spaceship and Plaee it is the total account value including invested positions, and for Crypto it is the fiat value of holdings. For Trading specifically it equals equityDetails.available + equityDetails.totalUsedMargin + equityDetails.currentPNL, so it includes margin deployed in open positions and unrealized profit and loss — the available portion can be a small fraction of it. Only for Cash accounts does it equal available cash. Do not use it to decide whether a trade or withdrawal is affordable — request expand=equityDetails and read equityDetails.available (Trading, Options, MoneyFarm, Cash, Plaee) or equityDetails.spendableBalanceInFiat (Crypto). Spaceship accounts expose no spendable figure. Note that equityDetails amounts are denominated in each account''s own native currency, not in displayCurrency, so they must be converted before being compared with displayBalance or totalBalance.'
        displayCurrency:
          type:
          - string
          - 'null'
          description: ISO 4217 currency code used for totalBalance and displayBalance values.
        balances:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AccountBalanceData'
          description: Individual account balances.
      additionalProperties: false
    BalanceAggregatorApi_PublicErrorResponse:
      type: object
      description: Standard error response returned by the API gateway.
      properties:
        errorCode:
          type:
          - string
          - 'null'
          description: Error code.
        errorMessage:
          type:
          - string
          - 'null'
          description: Human-readable error message.
      additionalProperties: false
    GetHistoricalBalancesResponse:
      type: object
      description: Historical end-of-day balance snapshots for the authenticated user.
      properties:
        gcid:
          type: integer
          format: int64
          description: The user's global customer ID.
        displayCurrency:
          type:
          - string
          - 'null'
          description: ISO 4217 currency code used for display values.
        fromDate:
          type: string
          format: date
          description: Start of the returned date range (inclusive, ISO 8601).
        toDate:
          type: string
          format: date
          description: End of the returned date range (inclusive, ISO 8601).
        snapshots:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/HistoricalDailySnapshotData'
          description: End-of-day balance snapshots, one entry per day in the requested range.
      additionalProperties: false
    AccountTypePathParam:
      type: string
      description: 'The type of eToro account, as accepted in the accountType path segment. Lowercase only: the route matches these values exactly and returns 404 for any other casing or for numeric values. Note this differs from the casing used for accountType in response bodies.'
      enum:
      - trading
      - cash
      - options
      - crypto
      - moneyfarm
      - spaceship
      - plaee
      example: trading
