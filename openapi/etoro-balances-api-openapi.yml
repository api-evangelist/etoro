openapi: 3.2.0
info:
  title: eToro Balances API
  version: v1.395.0
  description: 'eToro’s public API provides access to real-time financial data, trading insights, and account management features, allowing developers to integrate eToro’s services into their applications. With access to market prices, historical data, and social trading information, the API empowers users to enhance their trading strategies. Designed for security and scalability, the eToro API ensures smooth and reliable integration for a variety of financial applications.


    For more details on integrating with eToro''s public WebSocket service, please refer to the dedicated WebSocket documentation.


    ## Authentication


    Every request must be authenticated with exactly one of two options: an OAuth 2.0 access token (`Authorization: Bearer `), or the non-interactive credential pair (`x-api-key` + `x-user-key` headers). The two options are mutually exclusive — a request carrying both is rejected. Each operation lists the OAuth scopes that grant access as alternative security requirements: a bearer token needs only ONE of them, and the same permissions govern the credential pair.'
servers:
- url: https://public-api.etoro.com
  description: eToro Public API
security:
- apiKeyAuth: []
  userKeyAuth: []
- oauth2: []
tags:
- name: Balances
paths:
  /api/v1/balances:
    get:
      tags:
      - Balances
      summary: Get aggregated balances
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns aggregated balances across all account types for the authenticated user. Optionally filter by account type or specify the display currency for totals.


        Important: totalBalance and displayBalance are portfolio value, not spendable cash. For Trading, Options, MoneyFarm, Spaceship and Plaee they represent total account value including invested positions; for Crypto, the fiat value of holdings. Only for Cash accounts do they equal available cash. Do not use them to decide whether a trade or withdrawal is affordable — request expand=equityDetails and read equityDetails.available (Trading, Options, MoneyFarm, Cash, Plaee) or equityDetails.spendableBalanceInFiat (Crypto). Spaceship accounts expose no spendable figure. Note that equityDetails amounts are denominated in each account''s own native currency, not in displayCurrency, so they must be converted before being compared with displayBalance or totalBalance.'
      operationId: getBalances
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 93e903f7-fe99-4a57-9be9-930871879678
        description: A unique request identifier.
        example: 93e903f7-fe99-4a57-9be9-930871879678
      - name: accountTypes
        in: query
        description: 'Optional comma-separated list of account types to include. Valid values: Trading, Cash, Options, Crypto, MoneyFarm, Spaceship, Plaee (case-insensitive). Unrecognised values are silently ignored rather than rejected: if none of the supplied values are recognised the filter is dropped and all account types are returned, so verify the accountType values in the response rather than assuming the filter applied.'
        schema:
          type: string
      - name: displayCurrency
        in: query
        description: ISO 4217 currency code for totals and conversions. Defaults to USD.
        schema:
          type: string
          default: USD
      - name: includeZeroBalances
        in: query
        description: Whether to include accounts with a zero balance in the response. Defaults to false.
        schema:
          type: boolean
          default: false
      - name: includeSubAccounts
        in: query
        description: Whether to also include the user's sub-account Trading balances. Only effective when Trading is in scope — that is, when no accountTypes filter is supplied, or the filter includes trading. Sub-account entries are returned with accountType Trading and subType "subAccount". Defaults to false.
        schema:
          type: boolean
          default: false
      - name: expand
        in: query
        description: 'Comma-separated list of optional sections to include in the response. Valid values: equityDetails.'
        schema:
          type: string
      responses:
        '200':
          description: Aggregated balances retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBalancesResponse'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad Request — invalid query parameter value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesErrorResponse'
        '401':
          description: Unauthorized — missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden — the token does not include the etoro-public:money.balance:read scope.
        '429':
          description: Too Many Requests — rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:money.balance:read
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
  /api/v1/balances/history:
    get:
      tags:
      - Balances
      summary: Get historical balance snapshots
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns end-of-day balance snapshots across all account types for the authenticated user. History is available for the last 12 months. The maximum date range per request is 365 days.'
      operationId: getHistoricalBalances
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: d0e3ccea-74a6-439c-9850-002191e92b9b
        description: A unique request identifier.
        example: d0e3ccea-74a6-439c-9850-002191e92b9b
      - name: displayCurrency
        in: query
        description: ISO 4217 currency code for totals and conversions. Defaults to USD.
        schema:
          type: string
          default: USD
      - name: fromDate
        in: query
        description: 'Start of the date range (inclusive). Format: YYYY-MM-DD (ISO 8601). Defaults to toDate minus 30 days. Must be within the last 12 months. Maximum range with toDate: 365 days.'
        schema:
          type: string
          format: date
      - name: toDate
        in: query
        description: 'End of the date range (inclusive). Format: YYYY-MM-DD (ISO 8601). Defaults to today (UTC). Maximum range with fromDate: 365 days.'
        schema:
          type: string
          format: date
      - name: accountTypes
        in: query
        description: 'Optional comma-separated list of account types to include. Valid values: Trading, Cash, Options, Crypto, MoneyFarm, Spaceship, Plaee (case-insensitive). Plaee accounts have no end-of-day history yet: filtering by Plaee returns snapshots whose accountSnapshots are empty. Unrecognised values are silently ignored rather than rejected: if none of the supplied values are recognised the filter is dropped and all account types are returned, so verify the accountType values in the response rather than assuming the filter applied.'
        schema:
          type: string
      - name: includeSubAccounts
        in: query
        description: Whether to also include the user's qualifying sub-accounts in the aggregated history. Their end-of-day snapshots are merged by date with the primary account's and the daily totals are recalculated across all accounts. Only effective when Trading is in scope. Defaults to false.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Historical balance snapshots retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHistoricalBalancesResponse'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad Request — invalid date range or query parameter value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesErrorResponse'
        '401':
          description: Unauthorized — missing or invalid authentication credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden — the token does not include the etoro-public:money.balance:read scope.
        '404':
          description: Not Found — no historical data found for the specified date range.
        '429':
          description: Too Many Requests — rate limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceAggregatorApi_PublicErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
        '502':
          description: Bad Gateway — the historical balance archive is unavailable. No snapshots could be read; do not treat this as an empty history. Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalancesErrorResponse'
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:money.balance:read
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
