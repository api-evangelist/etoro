              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      properties:
                        name:
                          type: string
                          description: Preset name (use as {type} in GET /portfolios/rankings/presets/{type}).
