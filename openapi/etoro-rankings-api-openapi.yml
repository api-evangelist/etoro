openapi: 3.2.0
info:
  title: eToro Rankings API
  version: v1.395.0
  description: 'eToro’s public API provides access to real-time financial data, trading insights, and account management features, allowing developers to integrate eToro’s services into their applications. With access to market prices, historical data, and social trading information, the API empowers users to enhance their trading strategies. Designed for security and scalability, the eToro API ensures smooth and reliable integration for a variety of financial applications.


    For more details on integrating with eToro''s public WebSocket service, please refer to the dedicated WebSocket documentation.


    ## Authentication


    Every request must be authenticated with exactly one of two options: an OAuth 2.0 access token (`Authorization: Bearer `), or the non-interactive credential pair (`x-api-key` + `x-user-key` headers). The two options are mutually exclusive — a request carrying both is rejected. Each operation lists the OAuth scopes that grant access as alternative security requirements: a bearer token needs only ONE of them, and the same permissions govern the credential pair.'
servers:
- url: https://public-api.etoro.com
  description: eToro Public API
security:
- apiKeyAuth: []
  userKeyAuth: []
- oauth2: []
tags:
- name: Rankings
paths:
  /api/v2/portfolios/rankings:
    get:
      tags:
      - Rankings
      summary: Get paginated investor rankings
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns a paged list of investor ranking rows filtered and sorted by query parameters. `period` is required; all filter parameters are optional.'
      operationId: getPortfoliosRankings
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 8ce4e2c9-40ce-4b77-a3a1-68debef6ce62
        description: A unique request identifier.
        example: 8ce4e2c9-40ce-4b77-a3a1-68debef6ce62
      - name: period
        in: query
        required: true
        description: Rolling time window for performance metrics.
        schema:
          $ref: '#/components/schemas/StatsRankingsApi_RankingPeriod'
      - name: sort
        in: query
        required: false
        description: Sort field in camelCase; prefix with `-` for descending (e.g. `-copiers`). Unknown values are rejected with 400.
        schema:
          type: string
          example: -copiers
        example: -copiers
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: country
        in: query
        required: false
        description: Filter by ISO 3166-1 alpha-2 country code (e.g. "GB", "US").
        schema:
          type: string
      - name: gainMin
        in: query
        required: false
        schema:
          type: number
      - name: gainMax
        in: query
        required: false
        schema:
          type: number
      - name: copiersMin
        in: query
        required: false
        schema:
          type: integer
      - name: copiersMax
        in: query
        required: false
        schema:
          type: integer
      - name: riskScoreMin
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
      - name: riskScoreMax
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10
      - name: popularInvestor
        in: query
        required: false
        description: When true, filters to active Popular Investors only.
        schema:
          type: boolean
      - name: aumTier
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingsListResponse'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingsError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingsError'
        '429':
          description: Too Many Requests — the shared rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2: []
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
  /api/v2/portfolios/rankings/multiple:
    post:
      tags:
      - Rankings
      summary: Bulk-fetch ranking rows
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns ranking rows for a list of investors identified by username. Missing, private, or unranked users are silently omitted. Maximum 100 usernames per request.'
      operationId: getMultiplePortfoliosRankings
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 32ee2a4d-37da-40cf-8863-a734e91254d2
        description: A unique request identifier.
        example: 32ee2a4d-37da-40cf-8863-a734e91254d2
      - name: period
        in: query
        required: true
        description: Rolling time window for performance metrics.
        schema:
          $ref: '#/components/schemas/StatsRankingsApi_RankingPeriod'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - usernames
              properties:
                usernames:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 100
                  example:
                  - investor1
                  - investor2
      responses:
        '200':
          description: Successful response (order preserved, missing users omitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingsMultipleResponse'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingsError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingsError'
        '429':
          description: Too Many Requests — the shared rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2: []
      x-read-only: true
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
  /api/v2/portfolios/rankings/presets:
    get:
      tags:
