              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2: []
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
