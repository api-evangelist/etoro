  /api/v2/agent-portfolios/{agentPortfolioId}/user-tokens/{userTokenId}:
    patch:
      tags:
      - Agent Portfolios
      summary: Update User Token (v2)
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Updates the settings of an existing user token using scope names. At least one field must be provided. Scopes are specified by name (scopeNames); scope ids are not supported in v2.'
      operationId: updateAgentPortfoliosByAgentPortfolioIdUserTokensByUserTokenIdV2
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 650ce228-8318-4db3-a827-c54b5ef35dee
        description: A unique request identifier.
        example: 650ce228-8318-4db3-a827-c54b5ef35dee
      - name: agentPortfolioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the agent-portfolio.
      - name: userTokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the user token to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserTokenV2Request'
      responses:
        '204':
          description: User token updated successfully
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolioApi_ErrorResponse'
              examples:
                NoChanges:
                  summary: No changes provided
                  value:
                    errorCode: NoChangesDetected
                    errorMessage: At least one field must be provided
        '403':
          description: Forbidden — a requested scope name is not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolioApi_ErrorResponse'
              example:
                errorCode: ScopeNameNotAllowed
                errorMessage: Scope name not allowed
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolioApi_ErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '404':
          description: Agent-portfolio or user token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolioApi_ErrorResponse'
              examples:
                AgentPortfolioNotFound:
                  summary: Agent-portfolio not found
                  value:
                    errorCode: NotFound
                    errorMessage: Agent-portfolio not found
                UserTokenNotFound:
                  summary: User token not found
                  value:
                    errorCode: NotFound
                    errorMessage: User token not found
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolioApi_ErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolioApi_ErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
