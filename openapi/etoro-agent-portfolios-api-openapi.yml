      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 99f2f6d5-65ae-4123-aa21-55144f1a0ecc
        description: A unique request identifier.
        example: 99f2f6d5-65ae-4123-aa21-55144f1a0ecc
      - name: agentPortfolioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the agent-portfolio to delete.
      responses:
        '204':
          description: Agent-portfolio was successfully removed
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolioApi_ErrorResponse'
              example:
                errorCode: ValidationFailed
                errorMessage: Invalid agent-portfolio ID
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPortfolioApi_ErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '404':
