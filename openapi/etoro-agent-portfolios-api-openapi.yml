            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ScopeIdsRequired:
                  summary: Scope IDs are required
                  value:
                    errorCode: ScopeIdsRequired
                    errorMessage: ScopeIds is required
                InvalidIp:
                  summary: Invalid IP address
                  value:
                    errorCode: IpsWhitelistInvalidIp
                    errorMessage: IpsWhitelist contains an invalid IPv4 address
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '404':
          description: Agent-portfolio not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: NotFound
                errorMessage: Agent-portfolio not found
        '409':
          description: Conflict — a user token with the requested name already exists for this agent-portfolio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: UserKeyNameAlreadyExists
                errorMessage: UserKeyName already exists
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: MaxUserTokensExceeded
                errorMessage: Maximum number of user tokens exceeded
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
  /api/v1/agent-portfolios/{agentPortfolioId}/user-tokens/{userTokenId}:
    delete:
