  /api/v2/agent-portfolios/{agentPortfolioId}/user-tokens:
    post:
      tags:
      - Agent Portfolios
      summary: Create User Token (v2)
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Creates a new user token for the specified agent-portfolio using scope names. Scopes are specified by name (scopeNames); scope ids are not supported in v2.'
      operationId: createAgentPortfoliosByAgentPortfolioIdUserTokensV2
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: c958b7dc-b79e-4947-927a-6b7ea625f9f1
        description: A unique request identifier.
        example: c958b7dc-b79e-4947-927a-6b7ea625f9f1
      - name: agentPortfolioId
        in: path
        required: true
        schema:
          type: string
          format: uuid
