components:
  schemas:
    AgentPortfolioItem:
      type: object
      properties:
        agentPortfolioId:
          type: string
          format: uuid
          description: The unique identifier of the agent-portfolio.
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        agentPortfolioName:
          type: string
          description: The display name of the agent-portfolio.
          example: MyPort1
        agentPortfolioGcid:
          type: integer
          description: The GCID associated with the agent-portfolio.
          example: 12345678
        agentPortfolioVirtualBalance:
          type: number
          description: The fixed virtual balance (in USD) that the agent-portfolio was funded with. The investmentAmountInUsd used to copy is proportional to this balance.
          example: 10000
        mirrorId:
          type: integer
          description: The Trading API mirror ID for this agent-portfolio's copy trade.
          example: 12345
        createdAt:
          type: string
          format: date-time
          description: When this agent-portfolio was created.
          example: '2026-03-01T10:30:00+00:00'
        userTokens:
          type: array
          items:
            $ref: '#/components/schemas/AgentPortfolioUserTokenItem'
          description: The user tokens associated with this agent-portfolio.
    AgentPortfolioUserTokenItem:
      type: object
      properties:
        userTokenId:
          type: string
          format: uuid
          description: The unique identifier of the user token.
          example: f9e8d7c6-b5a4-3210-fedc-ba9876543210
        userTokenName:
          type: string
          description: The user-defined name for the user token.
          example: my-trading-token
        clientId:
          type: string
          format: uuid
          description: The OAuth client identifier associated with the user token.
          example: c1d2e3f4-a5b6-7890-cdef-123456789abc
        externalApplicationName:
          type: string
          description: The name of the external application registered for this token.
          example: Trading Bot v2
        ipsWhitelist:
          type: array
          items:
            type: string
          description: The set of whitelisted IP addresses authorized to use this token.
          example:
          - 192.168.1.1
        expiresAt:
          type: string
          format: date-time
          description: The expiration date and time of the user token in UTC.
          example: '2026-12-31T23:59:59Z'
        scopeIds:
          type: array
          items:
            type: integer
          deprecated: true
          description: '[DEPRECATED — use scopeNames instead] The set of permission scope identifiers granted to this token. Available scopes: 200 = etoro-public:real:read, 201 = etoro-public:demo:read, 202 = etoro-public:real:write, 203 = etoro-public:demo:write.'
          example:
          - 211
          - 212
        scopeNames:
          type: array
          items:
            type: string
          description: 'The set of permission scope names (preferred; replaces the deprecated scopeIds). Provide either scopeNames or scopeIds. Available scopes: etoro-public:real:read, etoro-public:demo:read, etoro-public:real:write, etoro-public:demo:write.'
          example:
          - etoro-public:trade.real:read
          - etoro-public:trade.real:write
        createdAt:
          type: string
          format: date-time
          description: When this user token was created.
          example: '2026-03-01T10:30:00Z'
    AgentPortfolioApi_ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorMessage:
          type: string
    CreateUserTokenV2Request:
      type: object
      properties:
        userTokenName:
          type: string
          description: A human-readable name to identify the user token.
          example: my-trading-token
        scopeNames:
          type: array
          items:
            type: string
          description: 'The set of permission scope names to grant to this token. Available scopes: etoro-public:trade.real:read, etoro-public:trade.real:write, etoro-public:trade.demo:read, etoro-public:trade.demo:write.'
          example:
          - etoro-public:trade.real:read
          - etoro-public:trade.real:write
        ipsWhitelist:
          type: array
          items:
            type: string
          description: An optional set of IPv4 addresses allowed to use this token.
