          format: date-time
          nullable: true
          description: Last-edited timestamp
          example: '2025-01-16T08:00:00Z'
        isDeleted:
          type: boolean
          description: True when the post has been soft-deleted
          example: false
        type:
          type: string
          enum:
          - Default
          - Share
          - MarketEvent
          - Trade
          - Order
          - Copy
          - Poll
          - Article
          description: Post type
          example: Default
        metadata:
          type: object
          description: Post type–specific metadata — only the relevant key is populated
          properties:
            share:
              type: object
              description: Share metadata — present when type is Share
              properties:
                sharedPost:
                  $ref: '#/components/schemas/Post'
                sharedOriginPost:
                  $ref: '#/components/schemas/Post'
            marketEvent:
              type: object
              description: Market event metadata — present when type is MarketEvent
              properties:
                earningReportId:
                  type: integer
                  description: Earnings report ID
                  example: 1042
                market:
                  $ref: '#/components/schemas/Market'
                stocksIndustryId:
                  type: integer
                  description: Industry sector ID
                  example: 15
                earningsDate:
                  type: string
                  format: date-time
                  description: Earnings announcement date
                  example: '2025-01-15T10:30:00Z'
                isBeforeMarketOpen:
                  type: boolean
                  description: Event occurs before market open
                  example: true
                earningsYear:
                  type: integer
                  description: Fiscal year of earnings
                  example: 2025
                earningsQuarter:
                  type: integer
                  description: Fiscal quarter (1–4)
                  example: 1
                verified:
                  type: boolean
                  description: Whether the event data is verified
                  example: true
                marketCap:
                  type: number
                  format: double
                  description: Market capitalisation in USD
                  example: 800000000000
                estimatedEps:
                  type: number
                  format: double
                  description: Estimated earnings per share
                  example: 1.42
                estimatedSales:
                  type: number
                  format: double
                  description: Estimated revenue in USD
                  example: 25000000000
                tagName:
                  type: string
                  enum:
                  - Reports
                  - Dividends
                  - Split
                  - ReverseSplit
                  description: Event tag
                  example: Reports
                textKey:
                  type: integer
                  description: Localisation key for event label
                  example: 3
            trade:
              type: object
              description: Trade metadata — present when type is Trade
              properties:
                type:
                  type: string
                  enum:
                  - Open
                  - Close
                  description: Trade lifecycle stage
                  example: Open
                positionId:
                  type: integer
                  description: Internal position ID
                  example: 987654321
                market:
                  $ref: '#/components/schemas/Market'
                gain:
                  type: number
                  format: float
                  description: P&L gain/loss percentage
                  example: 12.5
                rate:
                  type: number
                  format: float
                  description: Entry/exit rate
                  example: 245.3
                direction:
                  type: string
                  enum:
                  - Long
                  - Short
                  description: Trade direction
                  example: Long
            order:
              type: object
              description: Order metadata — present when type is Order
              properties:
                type:
                  type: string
                  enum:
                  - Open
                  - Close
                  description: Order lifecycle stage
                  example: Open
                orderId:
                  type: integer
                  description: Internal order ID
                  example: 123456789
                market:
                  $ref: '#/components/schemas/Market'
                rate:
                  type: number
                  format: float
                  description: Limit/entry rate
                  example: 240
                direction:
                  type: string
                  enum:
                  - Long
                  - Short
                  description: Order direction
                  example: Long
            copy:
              type: object
              description: Copy metadata — present when type is Copy
              properties:
                type:
                  type: string
                  enum:
                  - Start
                  - Stop
                  description: Copy event type
                  example: Start
                user:
                  $ref: '#/components/schemas/User'
            poll:
              type: object
              description: Poll metadata — present when type is Poll
              properties:
                id:
                  type: integer
                  description: Poll ID
                  example: 55
                title:
                  type: string
                  description: Poll question
                  example: Where do you see $TSLA by year-end?
                gcid:
                  type: integer
                  description: Poll creator GCID
                  example: 7890
                options:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Option ID
                        example: 1
                      index:
                        type: integer
                        description: Display order (1-based, matches the index supplied at poll creation)
                        example: 1
                        minimum: 1
                      text:
                        type: string
                        description: Option label
                        example: Bullish
                      isUserVoted:
                        type: boolean
                        description: Requester voted for this option
                        example: false
                      votesCount:
                        type: integer
                        description: Total votes for this option
                        example: 128
            article:
              type: object
              description: Article metadata — present when post type is Article
              properties:
                id:
                  type: integer
                  description: Article ID
                  example: 9001
                title:
                  type: string
                  description: Article title
                  example: Why TSLA Could Hit $500 This Year
                url:
                  type: string
                  description: Canonical article URL
                  example: https://etoro.com/news/markets/articles/why-tsla-could-hit-500
                rating:
                  type: string
                  enum:
                  - Bearish
                  - Bullish
                  nullable: true
                  description: Analyst rating
                  example: Bullish
                featuredImage:
                  $ref: '#/components/schemas/Attachment'
                body:
                  type: string
                  description: Full article HTML body
                  example: <p>Tesla has shown strong fundamentals...</p>
                bodyPreview:
                  type: string
                  description: Plain-text preview (≈200 chars)
                  example: Tesla has shown strong fundamentals this quarter...
                aiSummary:
                  type: string
                  description: AI-generated summary
                  example: Analyst argues Tesla's pipeline supports a $500 target by year-end.
                languageCode:
                  type: string
                  description: BCP-47 language code
                  example: en
                status:
                  type: string
                  enum:
                  - Draft
                  - Published
                  - Deleted
                  description: Publication status
                  example: Published
                editStatus:
                  type: string
                  enum:
                  - None
                  - Edited
                  - Moderated
                  description: Edit status
                  example: None
                ownerId:
                  type: integer
                  description: Author's internal user ID
                  example: 7890
                created:
                  type: string
                  format: date-time
                  description: When the article was created
                  example: '2025-01-15T10:30:00Z'
                updated:
                  type: string
                  format: date-time
                  nullable: true
                  description: Last edit timestamp
                  example: '2025-01-16T08:00:00Z'
                published:
                  type: string
                  format: date-time
                  nullable: true
                  description: Publication timestamp
                  example: '2025-01-16T09:00:00Z'
                readingTimeMinutes:
                  type: number
                  format: float
                  description: Estimated reading time
                  example: 3.5
                wordCount:
                  type: integer
                  description: Word count
                  example: 750
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        tags:
          type: array
          items:
            type: object
            properties:
              market:
                $ref: '#/components/schemas/Market'
        mentions:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: '#/components/schemas/User'
              isDirect:
                type: boolean
                description: Direct @-mention
                example: true
        isSpam:
          type: boolean
          description: True when the post is classified as spam
          example: false
        editStatus:
          type: string
          enum:
          - None
          - Edited
          - Moderated
          description: Edit lifecycle status
          example: None
    DiscussionsResponse:
      type: object
      description: Paginated feed response containing a list of discussions
      properties:
        discussions:
          type: array
          items:
            $ref: '#/components/schemas/Discussion'
        paging:
          type: object
          description: Pagination info
          properties:
            next:
              type: string
              description: URL to fetch the next page
              example: /api/v1/feeds/user/7890?offset=20&take=20
            offSet:
              type: integer
              description: Current page offset
              example: 0
            take:
              type: integer
              description: Page size used for this response
              example: 20
            version:
              type: string
              description: API version string
              example: v1
        metadata:
          type: object
          description: Feed-level metadata for analytics
          properties:
            experimentName:
              type: string
              description: Active A/B experiment name
              example: ForYouRankingV2
            streamType:
              type: string
              description: Actual stream/ranking type served
              example: ForYou
            designatedStreamType:
              type: string
              description: Intended stream type (may differ during A/B)
              example: ForYou
