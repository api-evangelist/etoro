                type:
                  type: string
                  enum:
                  - Open
                  - Close
                  description: Order lifecycle stage
                  example: Open
                orderId:
                  type: integer
                  description: Internal order ID
                  example: 123456789
                market:
                  $ref: '#/components/schemas/Market'
                rate:
                  type: number
                  format: float
                  description: Limit/entry rate
                  example: 240
                direction:
                  type: string
                  enum:
                  - Long
                  - Short
                  description: Order direction
                  example: Long
            copy:
              type: object
