                          type: boolean
                          example: true
                        enableAddingItems:
                          type: boolean
                          example: true
            enrichmentData:
              type: object
              description: Shared enrichment data referenced by the watchlist items, keyed by item identifier. Instruments are keyed by instrument id; users and smart portfolios are keyed by GCID.
              properties:
                instruments:
                  type: object
                  description: Market enrichment data for instrument items, keyed by instrument id.
                  additionalProperties:
                    $ref: '#/components/schemas/MarketEnrichData'
                users:
                  type: object
                  description: Popular-investor enrichment data for user items, keyed by GCID.
                  additionalProperties:
                    $ref: '#/components/schemas/UserEnrichData'
                smartPortfolios:
                  type: object
                  description: Smart-portfolio enrichment data for smart-portfolio items, keyed by GCID.
                  additionalProperties:
                    $ref: '#/components/schemas/SmartPortfolioEnrichData'
            pagination:
              type: object
              description: Pagination applied to the watchlist items
              properties:
                page:
                  type: integer
                  format: int32
                  example: 0
                pageSize:
                  type: integer
                  format: int32
                  example: 100
                totalCount:
                  type: integer
                  format: int32
                  example: 1
                hasNext:
                  type: boolean
                  example: false
        actions:
          type: object
          description: Client actions available on the component, keyed by action name
        meta:
          type: object
          description: Component metadata, including the client cache directive
          properties:
            cache:
              type: object
              properties:
                maxAgeSeconds:
                  type: integer
                  format: int32
                  example: 100
        errors:
          type: array
          items:
            type: object
