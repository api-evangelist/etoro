          type: string
          example: ok
        data:
          type: object
          description: Component payload containing the user's watchlists and enrichment data
          properties:
            watchlists:
              type: array
              description: User watchlists, enriched for client rendering
              items:
                allOf:
                - $ref: '#/components/schemas/WatchlistResponse'
                - type: object
                  properties:
                    userActions:
                      type: object
                      description: Which watchlist operations the caller may offer for this watchlist
                      properties:
                        enableRename:
                          type: boolean
                          example: true
                        enableDelete:
                          type: boolean
                          example: true
                        enableSetAsDefault:
                          type: boolean
                          example: true
