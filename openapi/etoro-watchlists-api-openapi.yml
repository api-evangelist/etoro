openapi: 3.2.0
info:
  title: eToro Watchlists API
  version: v1.395.0
  description: 'eToro’s public API provides access to real-time financial data, trading insights, and account management features, allowing developers to integrate eToro’s services into their applications. With access to market prices, historical data, and social trading information, the API empowers users to enhance their trading strategies. Designed for security and scalability, the eToro API ensures smooth and reliable integration for a variety of financial applications.


    For more details on integrating with eToro''s public WebSocket service, please refer to the dedicated WebSocket documentation.


    ## Authentication


    Every request must be authenticated with exactly one of two options: an OAuth 2.0 access token (`Authorization: Bearer `), or the non-interactive credential pair (`x-api-key` + `x-user-key` headers). The two options are mutually exclusive — a request carrying both is rejected. Each operation lists the OAuth scopes that grant access as alternative security requirements: a bearer token needs only ONE of them, and the same permissions govern the credential pair.'
servers:
- url: https://public-api.etoro.com
  description: eToro Public API
security:
- apiKeyAuth: []
  userKeyAuth: []
- oauth2: []
tags:
- name: Watchlists
paths:
  /api/v1/curated-lists:
    get:
      operationId: getCuratedLists
      tags:
      - Watchlists
      summary: Get curated lists
      description: '**Rate limit:** 60 requests per 60 seconds. This is a **dedicated** limit for this endpoint — it is **not shared** with (pooled across) any other endpoint, so the full rate is available to this endpoint alone.


        ---


        Retrieves curated investment lists available to the authenticated user.'
      responses:
        '200':
          description: Successfully retrieved curated lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratedListsResponse'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This limit is dedicated to this endpoint — it is not shared with (pooled across) any other endpoint.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '204':
          description: No curated lists available
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This limit is dedicated to this endpoint — it is not shared with (pooled across) any other endpoint.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '429':
          description: Too Many Requests — the rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This limit is dedicated to this endpoint — it is not shared with (pooled across) any other endpoint.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:demo:read
      - oauth2:
        - etoro-public:real:read
      - oauth2:
        - etoro-public:demo:write
      - oauth2:
        - etoro-public:real:write
      - oauth2:
        - etoro-public:watchlist:read
      - oauth2:
        - etoro-public:watchlist:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: false
        defaultPool: false
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: a682c047-8044-4478-985f-34fe46d5bd89
        description: A unique request identifier.
        example: a682c047-8044-4478-985f-34fe46d5bd89
