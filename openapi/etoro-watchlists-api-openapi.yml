          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This limit is dedicated to this endpoint — it is not shared with (pooled across) any other endpoint.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:demo:read
      - oauth2:
        - etoro-public:real:read
      - oauth2:
        - etoro-public:demo:write
      - oauth2:
        - etoro-public:real:write
      - oauth2:
        - etoro-public:watchlist:read
      - oauth2:
        - etoro-public:watchlist:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: false
        defaultPool: false
  /api/v1/watchlists:
    get:
      operationId: getWatchlists
      tags:
      - Watchlists
      summary: Get user watchlists
      description: '**Rate limit:** 60 requests per 60 seconds. This is a **shared quota** — the same budget is consumed by a group of related endpoints, so calling any of them reduces what is left for the others (you cannot call each at the full rate independently). Endpoints sharing this quota:

        - `GET /api/v1/watchlists/default-watchlists/items`

        - `GET /api/v1/watchlists/public/{userId}`

        - `GET /api/v1/watchlists/public/{userId}/{watchlistId}`

        - `GET /api/v1/watchlists/{watchlistId}`


        ---


        Retrieves all watchlists for the authenticated user with optional pagination and built-in watchlist management.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 97b432cf-07b8-4cb8-9485-29b12566b360
        description: A unique request identifier.
        example: 97b432cf-07b8-4cb8-9485-29b12566b360
      - name: itemsPerPageForSingle
        in: query
        description: Number of items to include per watchlist for pagination
        schema:
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 1000
          example: 100
        example: 100
      - name: ensureBuiltinWatchlists
        in: query
        description: Whether to ensure built-in watchlists are included
        schema:
          type: boolean
          default: true
          example: true
        example: true
      - name: addRelatedAssets
        in: query
        description: Whether to include related assets in the response
        schema:
          type: boolean
          default: false
          example: false
        example: false
      responses:
        '200':
          description: Successfully retrieved user watchlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistsResponse'
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 5 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '429':
          description: Too Many Requests — the shared rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 5 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:demo:read
      - oauth2:
        - etoro-public:demo:write
      - oauth2:
        - etoro-public:real:read
      - oauth2:
        - etoro-public:real:write
      - oauth2:
        - etoro-public:watchlist:read
      - oauth2:
        - etoro-public:watchlist:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: false
        sharedWith:
        - GET /api/v1/watchlists/default-watchlists/items
        - GET /api/v1/watchlists/public/{userId}
        - GET /api/v1/watchlists/public/{userId}/{watchlistId}
        - GET /api/v1/watchlists/{watchlistId}
    post:
      operationId: postWatchlists
      tags:
      - Watchlists
      summary: Create a new watchlist
      description: '**Rate limit:** 20 requests per 60 seconds. This is a **shared quota** — the same budget is consumed by a group of related endpoints, so calling any of them reduces what is left for the others (you cannot call each at the full rate independently). Endpoints sharing this quota:

        - `DELETE /api/v1/watchlists/{watchlistId}`

        - `DELETE /api/v1/watchlists/{watchlistId}/items`

        - `POST /api/v1/watchlists/default-watchlist/selected-items`

        - `POST /api/v1/watchlists/newasdefault-watchlist`

        - `POST /api/v1/watchlists/{watchlistId}/items`

        - `PUT /api/v1/watchlists/rank/{watchlistId}`

        - `PUT /api/v1/watchlists/setUserSelectedUserDefault/{watchlistId}`

        - `PUT /api/v1/watchlists/{watchlistId}`

        - `PUT /api/v1/watchlists/{watchlistId}/items`


        ---


        Creates a new watchlist for the authenticated user with the specified name and type.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 2e41f751-add4-41f6-bd7a-ebc3631ea20a
        description: A unique request identifier.
        example: 2e41f751-add4-41f6-bd7a-ebc3631ea20a
      - name: name
        in: query
        description: Name of the new watchlist
        required: true
        schema:
          type: string
          maxLength: 100
          example: Tech Watchlist
        example: Tech Watchlist
      - name: type
        in: query
        description: Type of watchlist to create
        schema:
          type: string
          enum:
          - Static
          - Dynamic
          default: Static
          example: Static
        example: Static
      - name: dynamicQuery
        in: query
        description: Dynamic query URL for dynamic watchlists
        schema:
          type: string
      responses:
        '201':
          description: Watchlist created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistsResponse'
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 10 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 20
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 20;w=60
        '429':
          description: Too Many Requests — the shared rate limit (20 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 10 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 20
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 20;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:demo:write
      - oauth2:
        - etoro-public:real:write
      - oauth2:
        - etoro-public:watchlist:write
      x-ratelimit:
        limit: 20
        window: 60
        shared: true
        defaultPool: false
        sharedWith:
        - DELETE /api/v1/watchlists/{watchlistId}
        - DELETE /api/v1/watchlists/{watchlistId}/items
        - POST /api/v1/watchlists/default-watchlist/selected-items
        - POST /api/v1/watchlists/newasdefault-watchlist
        - POST /api/v1/watchlists/{watchlistId}/items
        - PUT /api/v1/watchlists/rank/{watchlistId}
        - PUT /api/v1/watchlists/setUserSelectedUserDefault/{watchlistId}
        - PUT /api/v1/watchlists/{watchlistId}
