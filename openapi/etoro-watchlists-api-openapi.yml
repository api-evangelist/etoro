components:
  schemas:
    WatchlistsResponse:
      type: object
      description: Response containing multiple watchlists with metadata
      properties:
        status:
          type: integer
          format: int32
          description: HTTP status code of the response
          example: 200
        watchlists:
          type: array
          description: List of user watchlists
          items:
            $ref: '#/components/schemas/WatchlistResponse'
        exception:
          type: object
          description: Exception details when the request partially failed
          properties:
            invalidItems:
              type: array
              description: List of invalid item identifiers
              items:
                type: string
            reason:
              type: string
              description: Reason for the exception
            message:
              type: string
              description: Human-readable exception message
        meta:
          type: object
          description: Response metadata including pagination info
          properties:
            pageNumber:
              type: integer
              format: int32
              description: Current page number
              example: 0
            itemsPerPage:
              type: integer
              format: int32
              description: Number of items per page
              example: 100
            maxItemsInWatchlistLimit:
              type: integer
              format: int32
              description: Maximum allowed items per watchlist
              example: 1000
            maxWatchlistsLimit:
              type: integer
              format: int32
              description: Maximum allowed watchlists per user
              example: 10
        isSucceeded:
          type: boolean
          description: Whether the request succeeded
          example: true
    CuratedListItem:
      type: object
      description: Represents an item in a curated list
      properties:
        instrumentId:
          type: integer
          format: int32
          description: ID of the financial instrument
          example: 12345
    CuratedList:
      type: object
      description: Represents a curated investment list
      properties:
        uuid:
          type: string
          description: Unique identifier of the curated list
          example: '12345'
        name:
          type: string
          description: Display name of the curated list
          example: Tech Watchlist
        description:
          type: string
          description: Description of the curated list
          example: A list of tech stocks
        listImageUrl:
          type: string
          description: URL of the list's image
          example: https://example.com/tech-watchlist.jpg
        items:
          type: array
          description: Items in the curated list
          items:
            $ref: '#/components/schemas/CuratedListItem'
          example:
          - instrumentId: 12345
    MarketRecommendationsResponse:
      type: object
      description: Response containing market recommendations
      properties:
        ResponseType:
          type: string
          description: Type of recommendation response
          example: Instrument
        Recommendations:
          type: array
          description: List of recommended instrument IDs
          items:
            type: integer
            format: int32
          example:
          - 12345
          - 67890
    WatchlistItemDto:
      type: object
      description: Represents an item in a watchlist
      required:
      - itemId
      - itemType
      properties:
        itemId:
          type: integer
          format: int32
          description: Unique identifier of the financial instrument
          example: 12345
        itemType:
          type: string
          description: Type of the financial instrument (e.g., 'Instrument', 'Person')
          example: Instrument
        itemRank:
          type: integer
          format: int32
          description: Ranking position of the item in the watchlist
          default: 0
          example: 1
        itemAddedReason:
          type: string
          description: Reason the item was added to the watchlist
          example: Manual
        itemAddedDate:
          type: string
          format: date-time
          description: Date and time the item was added
        market:
          type: object
          description: Market metadata for the instrument when included
          properties:
            id:
              type: string
            symbolName:
              type: string
            displayName:
              type: string
            assetTypeId:
              type: integer
              format: int32
            assetTypeSubCategoryId:
              type: integer
              format: int32
              nullable: true
            exchangeId:
              type: integer
              format: int32
            hasExpirationDate:
              type: boolean
            avatar:
              type: object
              properties:
                small:
                  type: string
                medium:
                  type: string
                large:
                  type: string
                svg:
                  type: object
                  nullable: true
                  description: SVG avatar with background and text colors
                  properties:
                    url:
                      type: string
                    backgroundColor:
                      type: string
                    textColor:
                      type: string
    WatchlistResponse:
      type: object
      description: Represents a watchlist with its metadata and items
      properties:
        watchlistId:
          type: string
          description: Unique identifier of the watchlist
          example: '12345'
        name:
          type: string
          description: Display name of the watchlist
          example: Tech Watchlist
        Gcid:
          type: integer
          format: int32
          description: Global Customer ID of the watchlist owner
          example: 12345
        watchlistType:
          type: string
          enum:
          - Static
          - Dynamic
          - RecentlyInvested
          - Default
          description: Type of the watchlist
          example: Static
        totalItems:
          type: integer
          format: int32
          description: Total number of items in the watchlist
          example: 100
        isDefault:
          type: boolean
          description: Whether this is a default system watchlist
          example: true
        isUserSelectedDefault:
          type: boolean
          description: Whether this is the user's selected default watchlist
          example: true
        watchlistRank:
          type: integer
          format: int32
          description: Display order rank of the watchlist
          example: 1
        dynamicUrl:
          type: string
          nullable: true
          description: URL for dynamic watchlist queries
        items:
          type: array
          description: Items contained in the watchlist
          items:
            $ref: '#/components/schemas/WatchlistItemDto'
          example:
          - itemId: 12345
            itemType: Instrument
            itemRank: 1
        relatedAssets:
          type: array
          description: Related asset IDs
          nullable: true
          items:
            type: integer
            format: int32
          example:
          - 12345
          - 67890
    CuratedListsResponse:
      type: object
      description: Response containing curated investment lists
      properties:
        curatedLists:
          type: array
          description: List of curated investment lists
          items:
            $ref: '#/components/schemas/CuratedList'
