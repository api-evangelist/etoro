openapi: 3.0.1
info:
  title: Deprecated eToro Public API operations Agent Portfolios Watchlists API
  version: v1.158.0
  description: Snapshot of API operations that existed in the previous docs OpenAPI file and are no longer present in the current upstream Swagger.
tags:
- name: Watchlists
paths:
  /api/v1/curated-lists:
    get:
      tags:
      - Watchlists
      summary: Get curated lists
      description: Retrieves curated investment lists available to the authenticated user.
      responses:
        '200':
          description: Successfully retrieved curated lists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratedListsResponse'
        '204':
          description: No curated lists available
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 5b43a95b-8b78-4daa-891f-2e2dcc4cba11
        description: A unique request identifier.
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: lhgfaslk21490FAScVPkdsb53F9dNkfHG4faZSG5vfjndfcfgdssdgsdHF4663
        description: API key for authentication.
      - name: x-user-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: eyJlYW4iOiJVbnJlZ2lzdGVyZWRBcHBsaWNhdGlvbiIsImVrIjoiOE5sZ2cwcW5EUVdROUFNWGpXT2lmOWktZnpidG5KcUlqWGJ3WHJZZkpZcldrbG90ZEhvLVBjSWhQaU8xU1ZtMW84aU1WZGZqN2xWNzFjLXFxLmcybXE1dnh4Q1hUT25xaWRUaTFlcEhmVk1fIn0_
        description: User-specific authentication key.
      operationId: getCuratedLists
  /api/v1/market-recommendations/{itemsCount}:
    get:
      tags:
      - Watchlists
      summary: Get market recommendations
      description: Retrieves personalized market recommendations for the authenticated user.
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: a09d9f87-13c3-4d09-9da3-20f059084a77
        description: A unique request identifier.
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: lhgfaslk21490FAScVPkdsb53F9dNkfHG4faZSG5vfjndfcfgdssdgsdHF4663
        description: API key for authentication.
      - name: x-user-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: eyJlYW4iOiJVbnJlZ2lzdGVyZWRBcHBsaWNhdGlvbiIsImVrIjoiOE5sZ2cwcW5EUVdROUFNWGpXT2lmOWktZnpidG5KcUlqWGJ3WHJZZkpZcldrbG90ZEhvLVBjSWhQaU8xU1ZtMW84aU1WZGZqN2xWNzFjLXFxLmcybXE1dnh4Q1hUT25xaWRUaTFlcEhmVk1fIn0_
        description: User-specific authentication key.
      - name: itemsCount
        in: path
        description: Number of recommendations to return
        required: true
        schema:
          type: integer
          format: int16
          default: 10
          minimum: 1
          maximum: 100
        example: 10
      responses:
        '200':
          description: Successfully retrieved market recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketRecommendationsResponse'
        '204':
          description: No recommendations available
      operationId: getMarketRecommendations
  /api/v1/watchlists:
    get:
      tags:
      - Watchlists
      summary: Get user watchlists
      description: Retrieves all watchlists for the authenticated user with optional pagination and built-in watchlist management.
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: a23f4ec5-4334-4bd2-a5e6-27543bfde4c9
        description: A unique request identifier.
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: lhgfaslk21490FAScVPkdsb53F9dNkfHG4faZSG5vfjndfcfgdssdgsdHF4663
        description: API key for authentication.
      - name: x-user-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: eyJlYW4iOiJVbnJlZ2lzdGVyZWRBcHBsaWNhdGlvbiIsImVrIjoiOE5sZ2cwcW5EUVdROUFNWGpXT2lmOWktZnpidG5KcUlqWGJ3WHJZZkpZcldrbG90ZEhvLVBjSWhQaU8xU1ZtMW84aU1WZGZqN2xWNzFjLXFxLmcybXE1dnh4Q1hUT25xaWRUaTFlcEhmVk1fIn0_
        description: User-specific authentication key.
      - name: itemsPerPageForSingle
        in: query
        description: Number of items to include per watchlist for pagination
        schema:
          type: integer
          format: int32
          default: 100
          minimum: 1
          maximum: 1000
          example: 100
      - name: ensureBuiltinWatchlists
        in: query
        description: Whether to ensure built-in watchlists are included
        schema:
          type: boolean
          default: true
          example: true
      - name: addRelatedAssets
        in: query
        description: Whether to include related assets in the response
        schema:
          type: boolean
          default: false
          example: false
      responses:
        '200':
          description: Successfully retrieved user watchlists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistsResponse'
      operationId: getUserWatchlists
    post:
      tags:
      - Watchlists
      summary: Create a new watchlist
      description: Creates a new watchlist for the authenticated user with the specified name and type.
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 629691ba-bb2b-4e3c-9e23-a1f354025822
        description: A unique request identifier.
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: lhgfaslk21490FAScVPkdsb53F9dNkfHG4faZSG5vfjndfcfgdssdgsdHF4663
        description: API key for authentication.
      - name: x-user-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: eyJlYW4iOiJVbnJlZ2lzdGVyZWRBcHBsaWNhdGlvbiIsImVrIjoiOE5sZ2cwcW5EUVdROUFNWGpXT2lmOWktZnpidG5KcUlqWGJ3WHJZZkpZcldrbG90ZEhvLVBjSWhQaU8xU1ZtMW84aU1WZGZqN2xWNzFjLXFxLmcybXE1dnh4Q1hUT25xaWRUaTFlcEhmVk1fIn0_
        description: User-specific authentication key.
      - name: name
        in: query
        description: Name of the new watchlist
        required: true
        schema:
          type: string
          maxLength: 100
          example: Tech Watchlist
      - name: type
        in: query
        description: Type of watchlist to create
        schema:
          type: string
          enum:
          - Static
          - Dynamic
          default: Static
          example: Static
      - name: dynamicQuery
        in: query
        description: Dynamic query URL for dynamic watchlists
        schema:
          type: string
      responses:
        '201':
          description: Watchlist created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistsResponse'
      operationId: createANewWatchlist
  /api/v1/watchlists/default-watchlist/selected-items:
