              description: Reason for the exception
            message:
              type: string
              description: Human-readable exception message
        meta:
          type: object
          description: Response metadata including pagination info
          properties:
            pageNumber:
              type: integer
              format: int32
              description: Current page number
              example: 0
            itemsPerPage:
              type: integer
              format: int32
              description: Number of items per page
              example: 100
            maxItemsInWatchlistLimit:
              type: integer
              format: int32
              description: Maximum allowed items per watchlist
              example: 1000
            maxWatchlistsLimit:
              type: integer
              format: int32
              description: Maximum allowed watchlists per user
              example: 10
        isSucceeded:
          type: boolean
          description: Whether the request succeeded
          example: true
