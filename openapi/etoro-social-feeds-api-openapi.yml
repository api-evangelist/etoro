            isFlaggingAsSpam:
              type: boolean
              description: Requester flagged this as spam
              example: false
            isSubscribed:
              type: boolean
              description: Requester is subscribed to notifications
              example: false
            isLiking:
              type: boolean
              description: Requester has liked this comment
              example: false
            isSaved:
              type: boolean
              description: Requester has saved this comment
              example: false
            isPinned:
              type: boolean
              description: Comment is pinned
              example: false
            isRequesterBlocking:
              type: boolean
              description: Requester is blocking the comment owner
              example: false
            isInteractionRestricted:
              type: boolean
              description: Owner has blocked the requester
              example: false
    DiscussionsResponse:
      type: object
      description: Paginated feed response containing a list of discussions
      properties:
        discussions:
          type: array
          items:
            $ref: '#/components/schemas/Discussion'
        paging:
          type: object
          description: Pagination info
          properties:
            next:
              type: string
              description: URL to fetch the next page
              example: /api/v1/feeds/user/7890?offset=20&take=20
            offSet:
              type: integer
              description: Current page offset
              example: 0
            take:
              type: integer
              description: Page size used for this response
              example: 20
            version:
              type: string
              description: API version string
              example: v1
        metadata:
          type: object
          description: Feed-level metadata for analytics
          properties:
            experimentName:
              type: string
              description: Active A/B experiment name
              example: ForYouRankingV2
            streamType:
              type: string
              description: Actual stream/ranking type served
              example: ForYou
            designatedStreamType:
              type: string
              description: Intended stream type (may differ during A/B)
              example: ForYou
    CommentsResponse:
      type: object
      description: Paginated list of comments or replies on a parent entity
      properties:
        reactionPaging:
          type: object
          description: Pagination info
          properties:
            totalCount:
              type: integer
              description: Total number of comments/replies
              example: 42
            offsetEntityId:
              type: string
              description: Opaque cursor for next page
              example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            next:
              type: string
              description: URL to fetch the next page
