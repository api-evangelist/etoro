openapi: 3.2.0
info:
  title: eToro Social Feeds API
  version: v1.395.0
  description: 'eToro’s public API provides access to real-time financial data, trading insights, and account management features, allowing developers to integrate eToro’s services into their applications. With access to market prices, historical data, and social trading information, the API empowers users to enhance their trading strategies. Designed for security and scalability, the eToro API ensures smooth and reliable integration for a variety of financial applications.


    For more details on integrating with eToro''s public WebSocket service, please refer to the dedicated WebSocket documentation.


    ## Authentication


    Every request must be authenticated with exactly one of two options: an OAuth 2.0 access token (`Authorization: Bearer `), or the non-interactive credential pair (`x-api-key` + `x-user-key` headers). The two options are mutually exclusive — a request carrying both is rejected. Each operation lists the OAuth scopes that grant access as alternative security requirements: a bearer token needs only ONE of them, and the same permissions govern the credential pair.'
servers:
- url: https://public-api.etoro.com
  description: eToro Public API
security:
- apiKeyAuth: []
  userKeyAuth: []
- oauth2: []
tags:
- name: Social Feeds
paths:
  /api/v1/attachments:
    post:
      operationId: postAttachments
      tags:
      - Social Feeds
      summary: Upload a media attachment
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Two-step media upload: clients first upload a file here to receive an Attachment object, then pass its url in a POST /feeds/post or POST /reactions/.../comment payload. Accepts multipart/form-data with a binary file field. Supported formats: JPEG and PNG. Maximum file size: 8 MB (8,388,608 bytes). The returned url is a plain CDN URL scoped to the uploading user.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: daf10615-c571-4db6-9584-5b46a69d6df4
        description: A unique request identifier.
        example: daf10615-c571-4db6-9584-5b46a69d6df4
      - name: client_request_id
        in: query
        required: true
        description: Client-generated correlation ID (UUID). Required for request tracing and idempotency.
        schema:
          type: string
          format: uuid
        example: dcbf75de-be53-47fe-bfd0-61365e74f9d4
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'Required. The image file to upload. Supported formats: JPEG and PNG. Maximum size: 8 MB (8,388,608 bytes), enforced server-side.'
            encoding:
              file:
                contentType: image/jpeg, image/png
      responses:
        '200':
          description: Attachment uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad request — missing file or URL
        '401':
          description: Authentication required
        '422':
          description: Unsupported file type or file exceeds 8 MB limit
        '429':
          description: Too Many Requests — the shared rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:feed:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
  /api/v1/feeds/following:
    get:
      operationId: getFeedsFollowing
      tags:
      - Social Feeds
      summary: Get following feed
      description: '**Rate limit:** 60 requests per 60 seconds. This is a **shared quota** — the same budget is consumed by a group of related endpoints, so calling any of them reduces what is left for the others (you cannot call each at the full rate independently). Endpoints sharing this quota:

        - `GET /api/v1/feeds/for-you`

        - `GET /api/v1/feeds/instrument/{marketId}`

        - `GET /api/v1/feeds/markets/{marketId}`

        - `GET /api/v1/feeds/news`

        - `GET /api/v1/feeds/saved`

        - `GET /api/v1/feeds/user/{userId}`

        - `GET /api/v1/feeds/users/{userId}`

        - `GET /api/v1/feeds/users/{userId}/pinned`


        ---


        Returns a chronological feed of posts from users the authenticated user follows. Requires authentication.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: d039dadc-13db-4ed1-8970-9b5039800cb2
        description: A unique request identifier.
        example: d039dadc-13db-4ed1-8970-9b5039800cb2
      - name: take
        in: query
        description: Number of posts to return (1–100, default 20)
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        example: 20
      - name: offset
        in: query
        description: Number of posts to skip for pagination
        schema:
          type: integer
          default: 0
          minimum: 0
        example: 0
      - name: reactionsPageSize
        in: query
        description: Number of inline reactions to include per post (1–50, default 10)
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
        example: 10
      - name: badgesExperimentIsEnabled
        in: query
        description: Include user badges in the response
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Following feed posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscussionsResponse'
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 9 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '401':
          description: Authentication required
        '429':
          description: Too Many Requests — the shared rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 9 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2: []
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: false
        sharedWith:
