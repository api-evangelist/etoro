      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Removes a post from the authenticated user''s saved bookmarks. Idempotent — unsaving a post that was never saved succeeds silently.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: af9c50c5-ee8d-423e-936e-02d2417f6fdf
        description: A unique request identifier.
        example: af9c50c5-ee8d-423e-936e-02d2417f6fdf
      - name: postId
        in: path
        required: true
        description: ID of the post to unsave (UUID)
        schema:
          type: string
          format: uuid
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '204':
          description: Post unsaved successfully
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '401':
          description: Authentication required
        '404':
          description: Post not found
        '429':
          description: Too Many Requests — the shared rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:feed:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
  /api/v1/posts/{postId}/shares:
    get:
      operationId: getPostsByPostIdShares
      tags:
      - Social Feeds
      summary: List shares of a post
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns a paginated list of shares of the specified post, including both plain reshares and quote shares. Authentication is optional.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 9c24e62f-d356-476d-b1a1-1346ef9af138
        description: A unique request identifier.
        example: 9c24e62f-d356-476d-b1a1-1346ef9af138
      - name: postId
        in: path
        required: true
        description: ID of the post to list shares of (UUID)
        schema:
          type: string
          format: uuid
        example: d9020c00-c364-11ee-8080-80005148990b
      - name: take
        in: query
        description: Number of items to return (1–100, default 20)
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        example: 20
      - name: offsetEntityId
        in: query
        description: Opaque cursor from a previous response for stable paging
        schema:
          type: string
        example: c3d4e5f6-a7b8-4901-cdef-345678901234
      - name: order
        in: query
        description: Sort order
        schema:
          type: string
          enum:
          - Asc
          - Desc
          default: Desc
        example: Desc
      - name: client_request_id
        in: query
        required: true
        description: Client-generated correlation ID (UUID). Required for request tracing and idempotency.
        schema:
          type: string
          format: uuid
        example: 2b6361e3-079c-42a1-b6d5-4b9c16601ae1
      responses:
        '200':
          description: Paginated list of shares
          content:
            application/json:
