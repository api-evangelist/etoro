            attachments:
              type: array
              items:
                $ref: '#/components/schemas/Attachment'
            mentions:
              type: array
              items:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  isDirect:
                    type: boolean
                    description: Direct @-mention
