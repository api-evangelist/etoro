    OrderForCloseInfoResponse:
      type: object
      description: Close-order information returned by Admin TAPI, including execution status and the positions affected by the close order.
      required:
      - orderID
      - CID
      - statusID
      - orderType
      - operationType
      - assetCurrencyID
      - accountCurrencyID
      - instrumentID
      - requestOccurred
      - proceeds
      - externalOperationType
      properties:
        token:
          type: string
          description: Correlation token assigned to the request.
        orderID:
          type: integer
          format: int64
          description: Unique identifier of the close order.
        CID:
          type: integer
          format: int64
          description: Customer account identifier associated with the close order.
        statusID:
          type: integer
          format: int32
          description: 'Current status of the close order. Values: 1 = RECEIVED (pending); 2 = PLACED (pending); 3 = FILLED (terminal); 4 = REJECTED (terminal); 5 = PARTIALLY_FILLED (pending); 6 = PENDING_CANCEL (pending); 7 = CANCELED (terminal); 8 = EXPIRED (terminal); 9 = CANCELED_PARTIALLY_FILLED (terminal); 10 = REJECTED_PARTIALLY_FILLED (terminal); 11 = WAITING_FOR_MARKET (pending). Terminal statuses (3, 4, 7, 8, 9, 10) mean the order can no longer execute; pending statuses (1, 2, 5, 6, 11) mean it is still being processed and should be polled again. After DELETE, poll this endpoint until the status is terminal: 7 (CANCELED) means it was cancelled with nothing executed; 9 (CANCELED_PARTIALLY_FILLED) means it was cancelled after a partial fill - read the executed units from positions[]; 3 (FILLED) means it fully executed before the cancel took effect.'
        referenceID:
          type:
          - string
          - 'null'
          description: External reference identifier associated with the close order, when available.
        orderType:
          type: integer
          format: int32
          description: Internal order-type identifier.
        closeActionType:
          type:
          - integer
          - 'null'
          format: int32
          description: Internal close-action type, when available.
        operationType:
          type: integer
          format: int32
          description: Internal operation-type identifier.
        errorCode:
          type:
          - integer
          - 'null'
          format: int32
          description: Error code produced while processing the close order, when applicable.
        errorMessage:
          type:
          - string
          - 'null'
          description: Error message produced while processing the close order, when applicable.
        assetCurrencyID:
          type: integer
          format: int32
          description: Identifier of the asset currency.
        accountCurrencyID:
          type: integer
          format: int32
          description: Identifier of the account currency.
        instrumentID:
          type: integer
          format: int32
          description: Identifier of the instrument associated with the close order.
        requestOccurred:
          type: string
          format: date-time
          description: UTC timestamp at which the close-order request occurred.
        proceeds:
          type: number
          format: decimal
          description: Total proceeds calculated across the positions affected by the close order.
        externalOperationType:
          type: integer
          format: int32
          description: External operation-type identifier; zero when no external operation is associated.
        externalOperationData:
          type:
          - string
          - 'null'
          description: Data associated with the external operation, when available.
        positions:
          type: array
          description: Positions affected by the close order.
          items:
            $ref: '#/components/schemas/OrderForClosePositionInfoResponse'
    AggregatedPortfolioDemoMirrorFilter:
      type: object
