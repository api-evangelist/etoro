          - markup
          - marketSpread
          - transactionFee
          - overnightFee
          - overWeekendFee
          - sdrt
        value:
          type: number
          format: double
          description: The monetary value of this cost component, expressed in `currency`. The live response uses `value`; earlier versions of this documentation incorrectly named it `amount`.
        currency:
          type: string
          description: ISO 4217 currency code in which `value` is denominated.
