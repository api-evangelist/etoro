      description: Individual cost component in the requested order currency. `markup` is a price or currency-conversion markup applied by eToro; `marketSpread` is the market spread included in the execution price; `transactionFee` is a fee charged for executing the trade when applicable; `overnightFee` is a fee for keeping the position open overnight; `overWeekendFee` is a fee for keeping the position open over a weekend; and `sdrt` is the tax charged on eligible settled buy transactions.
