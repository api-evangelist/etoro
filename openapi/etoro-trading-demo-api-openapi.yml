    post:
      tags:
      - Trading - Demo
      summary: Get a what-if cost breakdown for opening or closing a position
      description: 'Returns the markup, market spread, transaction fee, overnight fee, over-weekend fee, and SDRT that would apply if the supplied order were executed now against the demo account. For `action: open`, exactly one of `symbol` or `instrumentId` must be provided and `leverage` must be at least 1. For `action: close`, `positionIds` must be non-empty.'
