            example:
              action: open
              transaction: buy
              symbol: null
              instrumentId: 101
              settlementType: cfd
              orderType: mkt
              triggerRate: null
              leverage: 2
              amount: 1000
              orderCurrency: usd
              units: null
              contracts: null
              stopLossRate: 1.2
              takeProfitRate: 1.5
              stopLossType: fixed
              additionalMargin: null
              positionIds: null
      responses:
        '202':
          description: Order accepted and queued for asynchronous processing. Returns the created order details.
