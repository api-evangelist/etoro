  /api/v1/trading/info/demo/aggregate-portfolio:
    get:
      tags:
      - Trading - Demo
      summary: Get demo account aggregated portfolio snapshot — account totals, positions aggregated by instrument, and copy trading
      description: Returns a complete snapshot of the authenticated user's demo account investment portfolio, organized by asset. The response includes account-level balances and equity, individually held positions grouped by asset, and any copy-trading relationships the user has active. Use the instrumentIds filter to scope results to a specific set of assets, or mirrorIds to isolate specific copy-trading relationships. Account totals always reflect the full portfolio regardless of filters applied.
      operationId: getAggregatedPortfolioDemo
      security:
      - bearerAuth: []
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 925c2023-ea2f-4d7a-8758-d1943e8680ac
        description: A unique request identifier.
      - name: x-api-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: lhgfaslk21490FAScVPkdsb53F9dNkfHG4faZSG5vfjndfcfgdssdgsdHF4663
        description: API key for authentication.
      - name: x-user-key
        in: header
        required: true
        schema:
          type: string
          format: password
          example: eyJlYW4iOiJVbnJlZ2lzdGVyZWRBcHBsaWNhdGlvbiIsImVrIjoiOE5sZ2cwcW5EUVdROUFNWGpXT2lmOWktZnpidG5KcUlqWGJ3WHJZZkpZcldrbG90ZEhvLVBjSWhQaU8xU1ZtMW84aU1WZGZqN2xWNzFjLXFxLmcybXE1dnh4Q1hUT25xaWRUaTFlcEhmVk1fIn0_
        description: User-specific authentication key.
      - name: conversionMode
        in: query
        required: false
        schema:
          type: string
          enum:
          - eToroApp
          - Realtime
          default: eToroApp
        description: Determines which conversion to use for non-USD assets when the market is closed. 'Realtime' uses the realtime conversion rate. 'eToroApp' uses the last conversion rate at market close time. Default is 'eToroApp'.
      - name: instrumentIds
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
        description: Scope the response to a specific list of assets by their eToro instrument ID. When omitted, all held assets are returned. Does not affect account-level totals.
      - name: mirrorIds
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          items:
            type: integer
            format: int32
        description: Scope copy-trading data to specific relationships by their mirror ID. A mirrorId of 0 refers to positions held directly (not via copy trading). When omitted, all copy-trading relationships are included.
      responses:
        '200':
          description: Successfully retrieved aggregated portfolio data
