      properties:
        cid:
          type: integer
          format: int32
          description: Customer ID.
        timestamp:
          type: string
          format: date-time
          description: Time at which this portfolio snapshot was calculated.
        accountCurrency:
          type: string
          description: ISO 4217 code of the account's base currency (e.g. 'USD').
        accountTotals:
          $ref: '#/components/schemas/AggregatedPortfolioAccountTotals'
        instrumentAggregates:
          type: array
          description: Positions held directly (not via copy trading), grouped by instrument.
          items:
            $ref: '#/components/schemas/AggregatedPortfolioInstrumentAggregate'
        mirrors:
          type: array
          description: Copy-trading relationships the user has active.
          items:
            $ref: '#/components/schemas/AggregatedPortfolioMirrorAggregate'
    Position:
      type: object
      properties:
        positionID:
          type: integer
          description: Unique identifier for the position
        CID:
          type: integer
          description: Customer ID associated with the position
        openDateTime:
          type: string
          format: date-time
          description: Timestamp when the position was opened in ISO 8601 format
        openRate:
          type: number
          format: float
          description: Entry price of the position in the instrument's currency
        instrumentID:
          type: integer
          description: Identifier of the traded instrument
        mirrorID:
          type: integer
          description: Mirror ID if the position is part of copy trading, 0 otherwise
        parentPositionID:
          type: integer
          description: Parent position ID for mirrored positions, 0 otherwise
        isBuy:
          type: boolean
          description: 'Position direction: true for long (buy) positions, false for short (sell) positions'
        takeProfitRate:
          type: number
          format: float
          description: Rate at which TakeProfit will trigger and send MarketOrder to close the position
        stopLossRate:
          type: number
          format: float
          description: Rate at which StopLoss will trigger and send MarketOrder to close the position
        amount:
          type: number
          format: float
          description: USD amount allocated to the position. This amount includes both the initial investment, and additional margin allocated to the position as collateral
        leverage:
          type: integer
          description: Leverage multiplier applied to the position
        orderID:
          type: integer
          description: Original orderID the position was opened by. Need to match together with orderType
        orderType:
          type: integer
          description: Original orderType of the order the position was opened by. Need to match together with orderId
        units:
          type: number
          format: float
          description: Number of units in the position
        totalFees:
          type: number
          format: float
          description: Total overnight fees and dividends charged/paid on the position in USD. Negative amount represents refund
        initialAmountInDollars:
          type: number
          format: float
          description: Initial investment USD amount in the position. This value does not change in case the position was partially closed
        isTslEnabled:
          type: boolean
          description: Indication if TrailingStopLoss feature is active on this position
        stopLossVersion:
          type: integer
          description: Manual stop loss edit version. Each time StopLossRate is manually update this value is incremented
        isSettled:
          type: boolean
          description: Obsolete
        redeemStatusID:
          type: integer
          description: If the position is currently in redeem process, this value represents the current status
        initialUnits:
          type: number
          format: float
          description: Initial invested units in the position. This value does not change in case the position was partially closed
        isPartiallyAltered:
          type: boolean
          description: Indication whether this position was partially closed
        unitsBaseValueDollars:
          type: number
          format: float
          description: USD value of the current units in the position, based on the initial investment. If the position was not partially altered, this value equals initialAmountInDollars
        isDiscounted:
          type: boolean
          description: Obsolete. This value is used to indicate if the relevant prices for the position are Ask/Bid or AskDiscounted/BidDiscounted
        openPositionActionType:
          type: integer
          description: Position open reason
        settlementTypeID:
          type: integer
          description: Position investment type. 0 - CFD, 1 - Real Asset, 2 - SWAP, 3 - Crypto MarginTrade, 4 - Future Contract
        isDetached:
          type: boolean
          description: Indication if the position was originally opened inside a mirror and detached from it
        openConversionRate:
          type: number
          format: float
          description: Conversion rate from the asset currency to USD at the time the position was opened
        pnlVersion:
          type: integer
          description: Pnl formula used for calculating profit and loss
        totalExternalFees:
          type: number
          format: float
          description: Total fees in USD charged on the position. Example - TicketFee. This value does not include overnight fees and dividends
        totalExternalTaxes:
          type: number
          format: float
          description: Total taxes in USD charged on the position. Example - SDRT
        isNoTakeProfit:
          type: boolean
          description: Indication if TakeProfit is enabled for the position. false = enabled, true = disabled
        isNoStopLoss:
          type: boolean
          description: Indication if StopLoss is enabled for the position. false = enabled, true = disabled
        lotCount:
          type: number
          format: float
          description: Number of lots the position represents. For FutureContracts, this value represents the number of contracts acquired. This property is not relevant for instruments that are not futures instruments
        unrealizedPnL:
          type: object
          nullable: true
          description: Unrealized profit/loss details for the position (only present in PnL endpoints)
          properties:
            pnL:
              type: number
              format: float
              description: Unrealized P&L in account currency
            pnlAssetCurrency:
              type: number
              format: float
              description: Unrealized P&L in asset currency
            exposureInAccountCurrency:
              type: number
              format: float
              description: Current exposure in account currency
            exposureInAssetCurrency:
              type: number
              format: float
              description: Current exposure in asset currency
            marginInAccountCurrency:
              type: number
              format: float
              description: Margin in account currency
            marginInAssetCurrency:
              type: number
              format: float
              description: Margin in asset currency
            marginCurrencyId:
              type: integer
              description: Currency ID for margin
            assetCurrencyId:
              type: integer
              description: Currency ID for the asset
            closeRate:
              type: number
              format: float
              description: Current close rate
            closeConversionRate:
              type: number
              format: float
              description: Current close conversion rate
            timestamp:
              type: string
              format: date-time
              description: Timestamp of the PnL calculation
    AggregatedPortfolioMirrorAggregate:
      type: object
      description: Aggregated data for a single copy-trading relationship.
      properties:
        mirrorId:
          type: integer
          format: int32
          description: Mirror identifier. A value of 0 represents manually held positions.
        mirrorAvailableCash:
          type: number
          format: double
          description: Cash available within this mirror for new copy positions.
        mirrorDepositTotal:
          type: number
          format: double
          description: 'Total amount ever deposited into this mirror: initialInvestment + depositSummary.'
        mirrorWithdrawalTotal:
          type: number
          format: double
          description: Total amount ever withdrawn from this mirror.
        mirrorStopLossPercentage:
          type: number
          format: double
          description: Stop-loss threshold as a percentage of the mirror's current value.
        mirrorStopLoss:
          type: number
          format: double
          description: Stop-loss threshold in account currency. The mirror liquidates when its value falls to this level.
        mirrorClosedPositionsPnl:
          type: number
          format: double
          description: Accumulated net profit from all closed positions within this mirror.
        mirrorTotals:
          $ref: '#/components/schemas/AggregatedPortfolioMirrorTotals'
        instrumentAggregates:
          type: array
          description: Positions held within this copy-trading mirror, grouped by instrument.
          items:
            $ref: '#/components/schemas/AggregatedPortfolioInstrumentAggregate'
    GetOrderInfoOpeningData:
      type: object
      description: Execution data recorded when the position was opened.
      properties:
        openTime:
          type: string
          format: date-time
          description: The timestamp when the position was opened.
        orderId:
          type: integer
          format: int64
          description: The order identifier that opened the position.
        executionTime:
          type: string
          format: date-time
          description: The execution timestamp.
        units:
          type: number
          format: double
          nullable: true
          description: Number of units executed.
        contracts:
          type: number
          format: double
          nullable: true
          description: Number of contracts executed.
        avgPrice:
          type: number
          format: double
          description: The average execution price.
        avgConversionRate:
          type: number
          format: double
          description: The average currency conversion rate applied.
        marketSpread:
          type: number
          format: double
          description: The market spread at execution time.
        markup:
          type: number
          format: double
          description: The markup applied to the spread.
        priceId:
          type: integer
          format: int64
          description: The price snapshot identifier used for execution.
        fees:
          type: number
          format: double
          description: Fees charged for the execution.
        taxes:
          type: number
          format: double
          description: Taxes applied to the execution.
    GetCostResponse:
      type: object
      description: Cost breakdown for a hypothetical open or close order.
      properties:
        instrumentId:
          type: integer
          format: int32
          description: Identifier of the instrument the cost breakdown applies to.
        symbol:
          type: string
          nullable: true
          description: Symbol of the instrument
        costs:
          type: array
          items:
            $ref: '#/components/schemas/CostBreakdown'
          description: Cost components that would apply to the proposed order.
        lastUpdated:
          type: string
          format: date-time
          description: Timestamp (ISO 8601) at which the cost figures were generated.
    OrderForClose:
      type: object
      properties:
        orderId:
          type: integer
          description: Unique identifier for the closing order.
        orderType:
          type: integer
          description: Type of order executed.
        statusId:
          type: integer
          description: Status of the closing order.
        cid:
          type: integer
          description: Customer ID associated with the order.
        openDateTime:
          type: string
          format: date-time
          description: The timestamp when the order was placed.
        lastUpdate:
          type: string
          format: date-time
          description: The timestamp of the last update to this order.
        instrumentId:
          type: integer
          description: The ID of the instrument traded.
        unitsToDeduct:
          type: number
          format: float
          description: The number of units closed in this order.
        lotsToDeduct:
          type: number
          format: float
          description: The number of lots closed in this order.
        positionId:
          type: integer
          description: The ID of the closed position.
    GetOrderInfoAsset:
      type: object
      description: Asset information associated with the order.
      properties:
        symbol:
          type: string
          description: The asset ticker symbol.
        instrumentId:
          type: integer
          format: int32
          description: The eToro instrument identifier.
        currency:
          type: string
          description: The asset's base currency.
        settlementType:
          type: string
          description: 'Settlement type. Possible values: cfd, real, realFutures, marginTrade.'
        leverage:
          type: integer
          format: int32
          description: The leverage applied to the order.
        side:
          type: string
          description: 'The position side. Possible values: long, short.'
    UnifiedOrderRequest:
      type: object
      description: Request payload for creating an order to open or close a position.
      required:
      - action
      - transaction
      properties:
        action:
          type: string
          description: 'The order action type. Possible values: open, close.'
          enum:
          - open
          - close
          example: open
        transaction:
          type: string
          description: 'The transaction direction. Possible values: buy, sell, sellShort, buyToCover.'
          enum:
          - buy
          - sell
          - sellShort
          - buyToCover
          example: buy
        symbol:
          type: string
          description: The asset ticker symbol. Required for open orders.
          nullable: true
          example: AAPL
        instrumentId:
          type: integer
          format: int32
          description: The eToro instrument identifier. Required for open orders.
          nullable: true
          example: 101
        settlementType:
          type: string
          description: 'The settlement type. Possible values: cfd, real, realFutures, marginTrade. Required for open orders.'
          nullable: true
          enum:
          - cfd
          - real
          - realFutures
          - marginTrade
          example: cfd
        orderType:
          type: string
          description: 'The order execution type. Possible values: mkt (market), mit (market if touched).'
          enum:
          - mkt
          - mit
          example: mkt
        triggerRate:
          type: number
          format: double
          nullable: true
          description: The trigger rate for mit orders. Required for mit orders.
        leverage:
          type: integer
          format: int32
          description: The leverage multiplier to apply. Required for open orders.
          nullable: true
          example: 2
        amount:
          type: number
          format: double
          nullable: true
          description: The monetary amount to invest in the order currency. Mutually exclusive with units and contracts.
          example: 1000.0
        orderCurrency:
          type: string
          description: The currency for the order amount. Typically usd.
          nullable: true
          example: usd
        units:
          type: number
          format: double
          nullable: true
          description: The number of units to trade. Mutually exclusive with amount and contracts.
        contracts:
          type: number
          format: double
          nullable: true
          description: The number of contracts to trade. Mutually exclusive with amount and units.
        stopLossRate:
          type: number
          format: double
          nullable: true
          description: The stop-loss rate at which the position will automatically close.
          example: 1.2
        takeProfitRate:
          type: number
          format: double
          nullable: true
          description: The take-profit rate at which the position will automatically close.
          example: 1.5
        stopLossType:
          type: string
          nullable: true
          description: 'The stop-loss type. Possible values: fixed, trailing.'
          enum:
          - fixed
          - trailing
          example: fixed
        additionalMargin:
          type: number
          format: double
          nullable: true
          description: Additional margin to allocate to the position.
        positionIds:
          type: array
          items:
            type: integer
            format: int64
          nullable: true
          description: List of position IDs to close. Required for close orders.
    UnifiedOrderResponse:
      type: object
      description: Response payload after successfully submitting an order.
      properties:
        token:
          type: string
          format: uuid
          description: A tracking token for the order request, used for correlation and debugging.
          example: 066faaee-e1e9-49d2-a568-c6e1cc336ad8
        orderId:
          type: integer
          format: int64
          description: The unique identifier of the created order.
          example: 13902598
        referenceId:
          type: string
          format: uuid
          description: The client reference identifier for the order, matching the X-Request-Id header if provided.
          example: 1c94300c-90aa-4303-9d00-dec376d74efb
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: {}
    Order:
      type: object
      properties:
        orderId:
          type: integer
          description: Unique identifier for the order
        cid:
          type: integer
          description: Customer ID associated with the order
        openDateTime:
          type: string
          format: date-time
          description: Date and time when the order was created
        instrumentId:
          type: integer
          description: Identifier of the instrument being traded
        isBuy:
          type: boolean
          description: Direction of the position. true - Long, false - Short
        takeProfitRate:
          type: number
          format: float
          description: Rate at which TakeProfit will trigger and send MarketOrder to close the position once it is open
        stopLossRate:
          type: number
          format: float
          description: Rate at which StopLoss will trigger and send MarketOrder to close the position once it is open
        rate:
          type: number
          format: float
          description: Asset rate at which to send market order to the market
        amount:
          type: number
          format: float
          description: USD amount to invest in the position
        leverage:
          type: integer
          description: Leverage multiplier to apply to the position
        units:
          type: number
          format: float
          description: Units to open the position. If this value is greater than zero the position will open on the requested units, and not amount
        isTslEnabled:
          type: boolean
          description: Indication if to enable TSL feature on the position once it is open
        executionType:
          type: integer
          description: Type of order execution
        isDiscounted:
          type: boolean
          description: Obsolete
        isNoTakeProfit:
          type: boolean
          description: Indication if TakeProfit is enabled for the order. false = enabled, true = disabled
        isNoStopLoss:
          type: boolean
          description: Indication if StopLoss is enabled for the order. false = enabled, true = disabled
    GetOrderInfoPositionExecution:
      type: object
      description: Details of a position execution resulting from the order.
      properties:
        positionId:
          type: integer
          format: int64
          description: The unique identifier of the executed position.
        state:
          type: string
          description: 'The current state of the position. Possible values: open, closed.'
        investedAmountCurrency:
          type: number
          format: double
          description: The invested amount in the account currency.
        initialExposureAccountCurrency:
          type: number
          format: double
          description: The initial exposure in the account currency.
        initialExposureAssetCurrency:
          type: number
          format: double
          description: The initial exposure in the asset currency.
        addedFunds:
          type: number
          format: double
          description: Additional funds added to the position.
        marginAccountCurrency:
          type: number
          format: double
          description: Margin held in the account currency.
        marginAssetCurrency:
          type: number
          format: double
          description: Margin held in the asset currency.
        remainingUnits:
          type: number
          format: double
          description: Remaining units in the position.
        remainingContracts:
          type: number
          format: double
          nullable: true
          description: Remaining contracts in the position.
        stopLossRate:
          type: number
          format: double
          nullable: true
          description: The stop-loss rate for the position.
        takeProfitRate:
          type: number
          format: double
          nullable: true
          description: The take-profit rate for the position.
        openingData:
          $ref: '#/components/schemas/GetOrderInfoOpeningData'
    InstrumentEligibilityRequest:
      type: object
      description: Request payload for checking instrument eligibility. At least one of `instrumentIds` or `symbols` must be provided; combined length must not exceed 100 instruments.
      properties:
        instrumentIds:
          type: array
          items:
            type: integer
            format: int32
          nullable: true
          description: Optional list of instrument IDs to check.
        symbols:
          type: array
          items:
            type: string
          nullable: true
          description: Optional list of instrument symbols to check.
        currency:
          type: string
          default: USD
          description: Requested currency for financial amounts in the eligibility response (e.g. minimum position size). Currently only USD is supported.
    PortfolioResponse:
      type: object
      description: Comprehensive portfolio information including positions, orders, and account status
      properties:
        clientPortfolio:
          type: object
          description: Container for all portfolio-related information
          properties:
            positions:
              type: array
              description: List of currently open trading positions
              items:
                $ref: '#/components/schemas/Position'
            credit:
              type: number
              format: float
              description: Available trading balance in USD, representing funds available for new positions
            mirrors:
              type: array
              description: Copy trading configurations and positions
              items:
                type: object
                description: Individual mirror trading setup
                properties:
                  mirrorID:
                    type: integer
                    description: Unique identifier for the mirror trading configuration
                  CID:
                    type: integer
                    description: Customer ID associated with the mirror
                  parentCID:
                    type: integer
                    description: Customer ID of the trader being copied
                  stopLossPercentage:
                    type: number
                    format: float
                    description: The precentage of the mirror value that the StopLossAmount represented at the time of the last edit. Adding or removing funds from the mirror will trigger recalculation of StopLossAmount based on this value compared to the current mirror value
                  isPaused:
                    type: boolean
                    description: Indication if the mirror is currently paused, restricting open of additional positions inside the mirror
                  copyExistingPositions:
                    type: boolean
                    description: Indication if mirror originally copied all parent existing position on mirror registration
                  availableAmount:
                    type: number
                    format: float
                    description: Available to trade USD balance in the mirror. This balance is reserved for mirror operations
                  stopLossAmount:
                    type: number
                    format: float
                    description: USD value of the mirror at which MirrorStopLoss will be triggered and cause liquidation of the mirror. Adding or removing funds from the mirror will trigger recalculation of this value based on StopLossPercentage compared to the current mirror value
                  initialInvestment:
                    type: number
                    format: float
                    description: USD amount initially invested in the mirror
                  depositSummary:
                    type: number
                    format: float
                    description: Total USD amount deposited into the mirror after initial investment
                  withdrawalSummary:
                    type: number
                    format: float
                    description: Total USD amount withdrawn from the mirror
                  positions:
                    type: array
                    description: Positions within this copy trading mirror
                    items:
                      $ref: '#/components/schemas/Position'
                  entryOrders:
                    type: array
                    description: Obsolete
                    items:
                      type: object
                  exitOrders:
                    type: array
                    description: Obsolete
                    items:
                      type: object
                  parentUsername:
                    type: string
                    description: Username of the trader being copied
                  closedPositionsNetProfit:
                    type: number
                    format: float
                    description: Total USD net profit of all positions that closed in the mirror
                  startedCopyDate:
                    type: string
                    format: date-time
                    description: Date and time when the mirror trading was initiated
                  pendingForClosure:
                    type: boolean
                    description: Indication if the mirror is in closure process
                  parentMirrors:
                    type: array
                    items:
                      type: object
                  mirrorCalculationType:
                    type: integer
                    description: (Obsolete) Mirror positions weights calculation methodology
                  ordersForOpen:
                    type: array
                    description: Active orders in the mirror to open positions
                    items:
                      type: object
                  ordersForClose:
                    type: array
                    description: Active orders in the mirror to close positions
                    items:
                      type: object
                  ordersForCloseMultiple:
                    type: array
                    description: Active orders in the mirror to close positions
                    items:
                      type: object
                  delayedOrderForClose:
                    type: array
                    description: Obsolete
                    items:
                      type: object
                  delayedOrderForOpen:
                    type: array
                    description: Obsolete
                    items:
                      type: object
                  mirrorStatusID:
                    type: integer
                    description: Current status of the mirror. 0 - Active, 1 - Paused, 2 - Pending Closure, 3 - In Alignment Process
            orders:
              type: array
              description: List of pending orders
              items:
                type: object
                description: Individual order details
                properties:
                  orderID:
                    type: integer
                    description: Unique identifier for the order
                  CID:
                    type: integer
                    description: Customer ID associated with the order
                  openDateTime:
                    type: string
                    format: date-time
                    description: Date and time when the order was created
                  instrumentID:
                    type: integer
                    description: Identifier of the instrument being traded
                  isBuy:
                    type: boolean
                    description: Direction of the position. true - Long, false - Short
                  takeProfitRate:
                    type: number
                    format: float
                    description: The take-profit trigger price at which the position will generate a Market Order to close (after it has opened). TakeProfit trigger price must be better than the current price.
                  stopLossRate:
                    type: number
                    format: float
                    description: The stop-loss trigger price at which the position will generate a Market Order to close (after it was opened). StopLoss trigger price must be worse than current price.
                  rate:
                    type: number
                    format: float
                    description: Asset rate at which to send market order to the market
                  amount:
                    type: number
                    format: float
                    description: USD amount to invest in the position
                  leverage:
                    type: number
                    format: float
                    description: Leverage multiplier to apply to the position
                  units:
                    type: number
                    format: float
                    description: Units to open the position. If this value is greater than zero the position will open on the requested units, and not amount
                  isTslEnabled:
                    type: boolean
                    description: Indicates if a trailing stop loss (TSL) is enabled. This means that the stoploss rate indicated will get updated automatically whenever the asset price increases (for long positions) or decreases (for short position) effectively keeping the stoploss in a constant gap from the best price achieved so far.
                  executionType:
                    type: integer
                    description: Type of order execution
                  isDiscounted:
                    type: boolean
                    description: Obsolete
            stockOrders:
              type: array
              description: Obsolete
              items:
                type: object
            entryOrders:
              type: array
              description: Obsolete
              items:
                type: object
            exitOrders:
              type: array
              description: Obsolete
              items:
                type: object
            ordersForOpen:
              type: array
              description: Active orders to open positions
              items:
                type: object
            ordersForClose:
              type: array
              description: Active orders to close positions
              items:
                type: object
            ordersForCloseMultiple:
              type: array
              description: Active orders to close multiple positions
              items:
                type: object
            bonusCredit:
              type: number
              format: float
              description: Bonus credit amount in USD available for trading
    ClientPortfolio:
      type: object
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'
          description: List of currently open trading positions
        credit:
          type: number
          format: float
          description: Available trading balance in USD, representing funds available for new actions
        mirrors:
          type: array
          items:
            $ref: '#/components/schemas/Mirror'
          description: Copy trading configurations and positions
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          description: List of pending orders
        ordersForOpen:
          type: array
          items:
            $ref: '#/components/schemas/OrderForOpen'
          description: Active orders to open positions
        ordersForClose:
          type: array
          items:
            $ref: '#/components/schemas/OrderForClose'
          description: Active orders to close positions
        ordersForCloseMultiple:
          type: array
          items:
            $ref: '#/components/schemas/OrderForCloseMultiple'
          description: Active orders to close multiple positions
        bonusCredit:
          type: number
          format: float
          description: Bonus credit amount in USD in the account
        unrealizedPnL:
          type: number
          format: float
          description: Total unrealized profit and loss across all open positions in the portfolio
        accountCurrencyId:
          type: integer
          description: Currency ID of the account (1 = USD)
        stockOrders:
          type: array
          items:
            type: object
          description: Stock-specific pending orders
        entryOrders:
          type: array
          items:
            type: object
          description: Entry orders awaiting execution
        exitOrders:
          type: array
          items:
            type: object
          description: Exit orders awaiting execution
    AggregatedPortfolioMirrorTotals:
      type: object
      description: Aggregated totals for a copy-trading mirror.
      properties:
        mirrorNetFunding:
          type: number
          format: double
          description: 'Net amount funded into the mirror: mirrorDepositTotal minus mirrorWithdrawalTotal.'
        mirrorPositionsPnl:
          type: number
          format: double
          description: Total P&L from open and closed positions within the mirror, in account currency.
        mirrorLiquidationValue:
          type: number
          format: double
          description: 'Current mirror value: mirrorActiveMargin + mirrorPositionsPnl.'
        mirrorPositionsPnlPercent:
          type: number
          format: double
          description: mirrorPositionsPnl as a percentage of mirrorLiquidationValue.
        mirrorMarginPercent:
          type: number
          format: double
          description: This mirror's active margin as a percentage of the account's total used margin.
        mirrorValuePercent:
          type: number
          format: double
          description: This mirror's liquidation value as a percentage of the account's total value.
        mirrorActiveMargin:
          type: number
          format: double
          description: 'Total margin in active use within this mirror: mirrorAvailableCash + sum of position margins minus closed positions P&L.'
