    AggregatedPortfolioDemoPostRequest:
      type: object
      description: All aggregation levels are honored. Omitted properties use the same defaults as GET.
      properties:
        conversionMode:
          type: string
          enum:
          - eToroApp
          - realtime
          default: eToroApp
        pnlLevel:
          type: string
          enum:
          - none
          - pnl
          - dailyPnl
          default: pnl
        accountLevel:
          type: string
          enum:
          - none
          - totals
          - details
          default: totals
          description: Controls accountTotals. none omits it; totals and details include full-portfolio totals.
        instrumentLevel:
          type: string
          enum:
          - none
          - totals
          - details
          default: totals
          description: Controls per-instrument aggregates for both the manual (non copy-trading) portfolio and each mirror's positions — a single request-level setting, not scoped per mirror. none omits instrument-level aggregates; totals and details include them at the requested level.
        mirrorLevel:
          type: string
          enum:
          - none
          - totals
          - details
          default: totals
          description: Controls copy-trading data. none omits mirrors and requires mirrorFilters to be absent; totals includes mirrors without their instrument-level aggregates; details additionally includes each mirror's instrument-level aggregates, per instrumentLevel.
        instrumentIds:
          type: array
          items:
            type: integer
            format: int32
        mirrorFilters:
          type:
          - array
          - 'null'
          description: Filters which copy-trading relationships to include, by mirror ID. Mirror ID 0 represents the manual (non copy-trading) part of the portfolio. When mirrorLevel is none, mirrorFilters must be absent — only the manual part of the portfolio is returned. When mirrorLevel is totals or details, an absent mirrorFilters returns all mirrors plus the manual part; an empty array returns none.
          items:
            $ref: '#/components/schemas/AggregatedPortfolioDemoMirrorFilter'
        dailyCutoffUtc:
          type: string
          format: date-time
          description: UTC timestamp representing the start of 'today' in the user's local timezone — normally the user's most recent local midnight, expressed in UTC. Required when pnlLevel is dailyPnl; rejected otherwise. Must not be more than 48 hours in the past or more than 5 minutes in the future.
