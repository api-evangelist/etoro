    LeverageConfiguration_2:
      type: object
      description: Leverage configuration for a specific settlement type and trade direction combination.
      properties:
        settlementType:
          type: string
          description: 'The settlement type this configuration applies to. Possible values: `cfd`, `real`, `realFutures`, `marginTrade`. `real` - the real instrument held in full value. `realFutures` - the real future contract, which is a derivative of an underlying instrument. Each future contract usually maintains a different number of underlying instrument units than 1. The number of units held in a single future contract is called the multiplier, which can be bigger, lower, or equal to 1. `marginTrade` - the real instrument held with only a portion of its value called margin (leveraged asset). `cfd` - contract for difference, which is a derivative following the underlying instrument.'
        direction:
          type: string
          description: 'The trade direction. Possible values: `long`, `short`.'
        leverageValues:
          type: array
          items:
            type: integer
            format: int32
          description: Available leverage multipliers for this settlement type and direction, for these configuration parameters.
        isPotential:
          type: boolean
          description: If true, additional user questionnaire may be required to allow the user to trade with this setup of settlement and leverages.
        minPositionAmount:
          type: number
          format: decimal
          description: Minimum margin required to open a position under this leverage configuration.
        allowEditStopLoss:
          type: boolean
          description: Whether the stop-loss can be edited for positions under this configuration.
        minStopLossPercentage:
          type: number
          format: decimal
          description: Minimum stop-loss percentage allowed from the allocated margin of the position. The stop-loss percentage is calculated based on the margin value, and documents the minimum allowed loss as a percentage of margin before the stop-loss closes the position.
        maxStopLossPercentage:
          type: number
          format: decimal
          description: Maximum stop-loss percentage allowed from the allocated margin of the position. The stop-loss percentage is calculated based on the margin value, and documents the maximum allowed loss as a percentage of margin before the stop-loss closes the position.
        defaultStopLossPercentage:
          type: number
          format: decimal
          description: Default stop-loss percentage applied when no explicit value is provided. The stop-loss percentage is calculated based on the margin value, and reflects how much of the margin value can be lost before the stop-loss closes the position.
        allowEditTakeProfit:
          type: boolean
          description: Whether the take-profit can be edited.
        minTakeProfitPercentage:
          type: number
          format: decimal
          description: Minimum take-profit percentage allowed from the allocated margin of the position. The take-profit percentage is calculated based on the margin value, and documents the minimum allowed gain as a percentage of margin before the take-profit closes the position.
        maxTakeProfitPercentage:
          type: number
          format: decimal
          description: Maximum take-profit percentage allowed from the allocated margin of the position. The take-profit percentage is calculated based on the margin value, and documents the maximum allowed gain as a percentage of margin before the take-profit closes the position.
        defaultTakeProfitPercentage:
          type: number
          format: decimal
          description: Default take-profit percentage applied when no explicit value is provided. The take-profit percentage is calculated based on the margin value, and reflects how much of the margin value can be gained before the take-profit closes the position.
        allowStopLossTakeProfit:
          type: boolean
          description: Whether stop-loss and take-profit can be set on a position.
