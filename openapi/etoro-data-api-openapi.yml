                instrumentId: 1001
                symbol: AAPL
                intervals:
                - interval: 1d
                  firstCandle: '2006-03-21T00:00:00Z'
                  lastCandle: '2026-09-27T21:00:00Z'
                  candles: 5123
                  loadedAt: '2026-09-28T07:30:00Z'
