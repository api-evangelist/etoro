openapi: 3.2.0
info:
  title: eToro Data API
  version: v1.395.0
  description: 'eToro’s public API provides access to real-time financial data, trading insights, and account management features, allowing developers to integrate eToro’s services into their applications. With access to market prices, historical data, and social trading information, the API empowers users to enhance their trading strategies. Designed for security and scalability, the eToro API ensures smooth and reliable integration for a variety of financial applications.


    For more details on integrating with eToro''s public WebSocket service, please refer to the dedicated WebSocket documentation.


    ## Authentication


    Every request must be authenticated with exactly one of two options: an OAuth 2.0 access token (`Authorization: Bearer `), or the non-interactive credential pair (`x-api-key` + `x-user-key` headers). The two options are mutually exclusive — a request carrying both is rejected. Each operation lists the OAuth scopes that grant access as alternative security requirements: a bearer token needs only ONE of them, and the same permissions govern the credential pair.'
servers:
- url: https://public-api.etoro.com
  description: eToro Public API
security:
- apiKeyAuth: []
  userKeyAuth: []
- oauth2: []
tags:
- name: Data
paths:
  /api/v1/data/instruments/{instrumentId}/candles:
    get:
      operationId: getPriceCandles
      tags:
      - Data
      summary: Get price candles for an instrument
      description: '**Rate limit:** 120 requests per 60 seconds. This is a **shared quota** — the same budget is consumed by a group of related endpoints, so calling any of them reduces what is left for the others (you cannot call each at the full rate independently). Endpoints sharing this quota:

        - `GET /api/v1/data/instruments/{instrumentId}/candles/coverage`


        ---


        Full-history OHLC candles for one instrument and interval, from a public view built and kept current by a DataPlatform job. Not user-scoped: identical for every caller for the same instrument and parameters. A range without `from` returns the most recent slice; a slice covers at most 10,080 periods of the interval (7 days of 1m, up to all history for 1d/1w), and a longer range is paged with the keyset `cursor` in `pagination.nextCursor`. An instrument with no data for the interval, or one eToro shows internally only, returns 200 with an empty `results` array, not 404. Call the coverage endpoint first to find a range that has data.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 85d4021d-1b0c-44a1-a812-36b3a2eec6fb
        description: A unique request identifier.
        example: 85d4021d-1b0c-44a1-a812-36b3a2eec6fb
      - name: instrumentId
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
        description: eToro instrument id, e.g. 1001 for AAPL.
      - name: interval
        in: query
        required: true
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 10m
          - 15m
          - 30m
          - 1h
          - 4h
          - 1d
          - 1w
        description: Candle interval.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Inclusive lower bound on candle open time, ISO 8601 with a time zone. Defaults to one slice before `to`.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Exclusive upper bound on candle open time, ISO 8601 with a time zone. Defaults to now.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 2000
          default: 100
        description: Candles per page. Defaults to 100, maximum 2000.
      - name: side
        in: query
        required: false
        schema:
          type: string
          enum:
          - bid
          - ask
          - both
          default: bid
        description: Price side to return. Defaults to bid.
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - verbose
          - compact
          default: verbose
        description: '`compact` names each column once; `results` becomes one array per candle instead of an object.'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque token from `pagination.nextCursor`.
      responses:
        '200':
          description: One page of candles for the requested instrument and interval, newest first unless walking an older slice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceCandlesPage'
              example:
                instrumentId: 1001
                symbol: AAPL
                interval: 1d
                side: bid
                window:
                  from: '2026-09-01T00:00:00Z'
                  to: '2026-09-28T00:00:00Z'
                pagination:
                  limit: 100
                  hasNext: false
                  nextCursor: null
                results:
                - time: '2026-09-27T21:00:00Z'
                  open: '228.5'
                  high: '231.2'
                  low: '227.9'
                  close: '230.1'
                  volume: '1234567'
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
              description: Correlation id for this call, generated by the data platform upstream when the request arrives without one and identical end to end. Quote it to eToro support to find the request in logs.
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Echoed back only when the caller supplied it. The upstream never generates one.
            X-Timestamp:
              schema:
                type: string
                format: date-time
              description: RFC 3339 instant the response was produced.
            Cache-Control:
              schema:
                type: string
              description: Always `public, max-age=30` -- this is market data, not customer-scoped.
              example: public, max-age=30
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 2 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 120
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 120;w=60
        '400':
          description: Invalid parameters -- an out-of-range interval, a malformed timestamp without a time zone, `from` not earlier than `to`, or an unrecognized cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataApiError'
              example:
                success: false
                error:
                  code: INVALID_TIME_RANGE
                  message: '`from` must be earlier than `to`'
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
              description: Correlation id for this call, generated by the data platform upstream when the request arrives without one and identical end to end. Quote it to eToro support to find the request in logs.
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Echoed back only when the caller supplied it. The upstream never generates one.
            X-Timestamp:
              schema:
                type: string
                format: date-time
              description: RFC 3339 instant the response was produced.
            Cache-Control:
              schema:
                type: string
              description: Always `public, max-age=30` -- this is market data, not customer-scoped.
              example: public, max-age=30
        '503':
          description: The serving dependency is temporarily unavailable; the upstream already retried with backoff before returning this. Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataApiError'
              example:
                success: false
                error:
                  code: DEPENDENCY_UNAVAILABLE
                  message: The requested resource is temporarily unavailable
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
              description: Correlation id for this call, generated by the data platform upstream when the request arrives without one and identical end to end. Quote it to eToro support to find the request in logs.
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Echoed back only when the caller supplied it. The upstream never generates one.
            X-Timestamp:
              schema:
                type: string
                format: date-time
              description: RFC 3339 instant the response was produced.
            Cache-Control:
              schema:
                type: string
              description: Always `public, max-age=30` -- this is market data, not customer-scoped.
              example: public, max-age=30
        '429':
          description: Too Many Requests — the shared rate limit (120 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: 'Maximum number of requests allowed per window. This budget is SHARED across 2 endpoints (it is NOT per-endpoint): a request to any endpoint in the group spends the same budget. See this operation''s description for the full list of endpoints sharing it.'
              schema:
                type: integer
              example: 120
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 120;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:real:read
      - oauth2:
        - etoro-public:demo:read
      - oauth2:
        - etoro-public:real:write
      - oauth2:
        - etoro-public:demo:write
      - oauth2:
        - etoro-public:market-data:read
      x-real-money: false
      x-ratelimit:
        limit: 120
        window: 60
        shared: true
        defaultPool: false
        sharedWith:
        - GET /api/v1/data/instruments/{instrumentId}/candles/coverage
  /api/v1/data/instruments/{instrumentId}/candles/coverage:
    get:
      operationId: getPriceCandleCoverage
      tags:
      - Data
      summary: Get where price candles exist for an instrument
      description: '**Rate limit:** 120 requests per 60 seconds. This is a **shared quota** — the same budget is consumed by a group of related endpoints, so calling any of them reduces what is left for the others (you cannot call each at the full rate independently). Endpoints sharing this quota:

        - `GET /api/v1/data/instruments/{instrumentId}/candles`


        ---


        Returns, per interval, the oldest and newest candle, how many exist, and when the daily load last refreshed them. Call it before requesting candles to pick an interval and a range that has data: history can span more than 15 years, and ranges outside it return empty pages. Not user-scoped. An instrument with no data, or one eToro shows internally only, returns an empty `intervals` list, not a 404.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 33fdb95c-6295-4af9-8d4e-7e5ad59f9cd0
        description: A unique request identifier.
        example: 33fdb95c-6295-4af9-8d4e-7e5ad59f9cd0
      - name: instrumentId
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
        description: eToro instrument id, e.g. 1001 for AAPL.
      responses:
        '200':
          description: Where candles exist for this instrument, one entry per interval that has data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceCandleCoverage'
