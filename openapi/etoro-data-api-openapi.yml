components:
  schemas:
    PriceCandleCoverage:
      type: object
      description: Where candles exist for one instrument, per interval. A single resource, not a collection.
      properties:
        instrumentId:
          type: integer
          format: int32
        symbol:
          type:
          - string
          - 'null'
          description: Instrument display name, e.g. AAPL/USD. Null when there is no data.
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/IntervalCoverage'
      required:
      - instrumentId
      - symbol
      - intervals
    Pagination:
      type: object
      description: Offset pagination metadata for a collection response.
      properties:
        page:
          type: integer
          format: int32
          description: 1-based index of the page returned.
          example: 1
        pageSize:
          type: integer
          format: int32
          description: Maximum number of items that could be returned on this page.
          example: 50
        hasNext:
          type: boolean
          description: Whether a further page exists after this one.
          example: false
      required:
      - page
      - pageSize
      - hasNext
    PriceCandlesPage:
      type: object
      description: One page of price candles for a single instrument and interval.
      properties:
        instrumentId:
          type: integer
          format: int32
        symbol:
          type:
          - string
          - 'null'
          description: Instrument display name, e.g. AAPL/USD. Null when the page is empty.
        interval:
          type: string
          enum:
          - 1m
          - 5m
          - 10m
          - 15m
          - 30m
          - 1h
          - 4h
          - 1d
          - 1w
        side:
          type: string
          enum:
          - bid
          - ask
          - both
        window:
          $ref: '#/components/schemas/TimeWindow'
        pagination:
          $ref: '#/components/schemas/CursorPagination'
        results:
          type: array
          items:
            $ref: '#/components/schemas/PriceCandle'
      required:
      - instrumentId
      - symbol
      - interval
      - side
      - window
      - pagination
      - results
    StockbackPromoStatus:
      type: object
      description: 'The caller''s current StockBack/Cashback promo enrollment and lifetime USD figures. Every field is nullable: a caller not (yet) enrolled in the promo still returns 200 with mostly-null values.'
      properties:
        isOptedIn:
          type:
          - boolean
          - 'null'
          description: Whether the caller is currently opted into the StockBack promo.
          example: true
        selectedStock:
          type:
          - string
          - 'null'
          description: Ticker symbol of the stock the caller selected for StockBack, if opted in.
          example: AAPL
        currentIsPi:
          type:
          - boolean
          - 'null'
          description: Whether the caller is currently classified as a Professional Investor.
          example: false
        rewardChannel:
          type:
          - string
          - 'null'
          description: The channel this caller's reward is delivered through.
          example: stockback
        currentClub:
          type:
          - string
          - 'null'
          description: The caller's current eToro Club tier.
          example: Silver
        currentCountry:
          type:
          - string
          - 'null'
          description: The caller's current country.
          example: GB
        expectedCurrentMonthUsd:
          type:
          - number
          - 'null'
          format: double
          description: Reward expected to accrue this calendar month, in USD.
          example: 12.34
        stockbackLifetimeUsd:
          type:
          - number
          - 'null'
          format: double
          description: Lifetime StockBack reward earned, in USD.
          example: 100.5
        cashbackLifetimeUsd:
          type:
          - number
          - 'null'
          format: double
          description: Lifetime Cashback reward earned, in USD.
          example: 50.25
        totalLifetimeUsd:
          type:
          - number
          - 'null'
          format: double
          description: Lifetime total reward earned (StockBack + Cashback), in USD.
          example: 150.75
    DataApiError:
      type: object
      description: 'Error envelope returned by the data platform upstream. Response metadata is not in the body: the correlation id, the request id and the timestamp are returned as the `X-Correlation-Id`, `X-Request-Id` and `X-Timestamp` response headers. Quote `X-Correlation-Id` to eToro support to find the request in logs.'
      properties:
        success:
          type: boolean
          description: Always false on an error response.
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine-readable error code, UPPER_SNAKE_CASE.
            message:
              type: string
              description: Human-readable description. Not intended for display to end users.
          required:
          - code
          - message
      required:
      - success
      - error
    PriceCandle:
      type: object
      description: One candle for a single price side (`side=bid` or `side=ask`).
      properties:
        time:
          type: string
          format: date-time
          description: Candle open time, UTC.
        open:
          type:
          - string
          - 'null'
          description: First price in the candle, as an exact decimal string.
        high:
          type:
          - string
          - 'null'
          description: Highest price in the candle.
        low:
          type:
          - string
          - 'null'
          description: Lowest price in the candle.
        close:
          type:
          - string
          - 'null'
          description: Last price in the candle.
        volume:
          type:
          - string
          - 'null'
          description: Source volume, passed through. Frequently null; null means not reported.
      required:
      - time
      - open
      - high
      - low
      - close
      - volume
    IntervalCoverage:
      type: object
      description: Where one interval has data for an instrument.
      properties:
        interval:
          type: string
          enum:
          - 1m
          - 5m
          - 10m
          - 15m
          - 30m
          - 1h
          - 4h
          - 1d
          - 1w
        firstCandle:
          type: string
          format: date-time
          description: Open time of the oldest candle, UTC.
        lastCandle:
          type: string
          format: date-time
          description: Open time of the newest candle, UTC.
        candles:
          type: integer
          format: int64
          description: Number of candles available.
        loadedAt:
          type: string
          format: date-time
          description: When the daily load last refreshed this interval, UTC.
      required:
      - interval
      - firstCandle
      - lastCandle
      - candles
      - loadedAt
    TimeWindow:
      type: object
      description: 'The requested time range, after defaults: [from, to).'
      properties:
        from:
          type: string
          format: date-time
          description: Inclusive lower bound, UTC.
        to:
          type: string
          format: date-time
          description: Exclusive upper bound, UTC.
      required:
      - from
      - to
    ClosedPositionEventsHistoryItem:
      type: object
      description: 'One closed-position history entry: the count of closed position events for a single close year and asset type.'
      properties:
        closeYear:
          type: integer
          format: int32
          description: Calendar year the position events closed in.
          example: 2023
        assetType:
          type: string
          description: Asset type of the closed positions counted in this entry.
          example: Stocks
        closedPositionEvents:
          type: integer
          format: int32
          description: Count of closed position events for this close year and asset type.
          example: 4
      required:
      - closeYear
      - assetType
      - closedPositionEvents
    CursorPagination:
      type: object
      description: Keyset pagination metadata for a time-ordered collection. `hasNext` is always present; `nextCursor` is opaque and is null exactly when `hasNext` is false.
      properties:
        limit:
          type: integer
          format: int32
          description: Maximum number of items that could be returned on this page.
          example: 100
        hasNext:
          type: boolean
          description: Whether a further page exists after this one.
          example: false
        nextCursor:
          type:
          - string
          - 'null'
          description: Opaque token for the next page; pass it back unchanged as `cursor`. Null when there is no further page.
      required:
      - limit
      - hasNext
      - nextCursor
    ClosedPositionEventsHistoryPage:
      type: object
      description: One page of closed-position history entries. The collection is a property of this object rather than a bare top-level array, so further fields can be added without a breaking change.
      properties:
        results:
          type: array
          description: History entries for this page, oldest close year first.
          items:
            $ref: '#/components/schemas/ClosedPositionEventsHistoryItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
      - results
      - pagination
