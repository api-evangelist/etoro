  /api/v1/data/positions/closed-events/history:
    get:
      operationId: getClosedPositionEventsHistory
      tags:
      - Data
      summary: Get the caller's closed position event history counts
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns the calling customer''s historical count of closed position events, broken down by close year and asset type, one entry per (closeYear, assetType) combination sorted ascending by year then asset type. This is user-scoped: the caller is identified by their own gateway-issued GCID, not a path or query parameter, so it always answers for ''me''. Results are returned under `results` with a `pagination` block; a customer with no closed-position history returns 200 with an empty `results` array, not 404 - there is no distinguishable ''not found'' state for this endpoint.'
      responses:
        '200':
          description: One page of the caller's closed position event history counts, oldest year first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosedPositionEventsHistoryPage'
              example:
                results:
                - closeYear: 2023
                  assetType: Stocks
                  closedPositionEvents: 4
                - closeYear: 2024
                  assetType: Crypto
                  closedPositionEvents: 2
                pagination:
                  page: 1
                  pageSize: 50
                  hasNext: false
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
              description: Correlation id for this call, generated by the data platform upstream when the request arrives without one and identical end to end. Quote it to eToro support to find the request in logs.
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Echoed back only when the caller supplied it. The upstream never generates one.
            X-Timestamp:
              schema:
                type: string
                format: date-time
              description: RFC 3339 instant the response was produced.
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store` -- this is customer-scoped data.
              example: private, no-store
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: The page or pageSize query parameter is out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataApiError'
              example:
                success: false
                error:
                  code: INVALID_REQUEST
                  message: The request is invalid
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
              description: Correlation id for this call, generated by the data platform upstream when the request arrives without one and identical end to end. Quote it to eToro support to find the request in logs.
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Echoed back only when the caller supplied it. The upstream never generates one.
            X-Timestamp:
              schema:
                type: string
                format: date-time
              description: RFC 3339 instant the response was produced.
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store` -- this is customer-scoped data.
              example: private, no-store
        '401':
          description: The gateway did not inject a GCID for this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataApiError'
              example:
                success: false
                error:
                  code: GCID_REQUIRED
                  message: This endpoint requires a gateway-issued GCID
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
              description: Correlation id for this call, generated by the data platform upstream when the request arrives without one and identical end to end. Quote it to eToro support to find the request in logs.
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Echoed back only when the caller supplied it. The upstream never generates one.
            X-Timestamp:
              schema:
                type: string
                format: date-time
              description: RFC 3339 instant the response was produced.
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store` -- this is customer-scoped data.
              example: private, no-store
        '503':
          description: The serving dependency is temporarily unavailable; the upstream already retried with backoff before returning this. Safe to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataApiError'
              example:
                success: false
                error:
                  code: DEPENDENCY_UNAVAILABLE
                  message: The requested resource is temporarily unavailable
          headers:
            X-Correlation-Id:
              schema:
                type: string
                format: uuid
              description: Correlation id for this call, generated by the data platform upstream when the request arrives without one and identical end to end. Quote it to eToro support to find the request in logs.
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Echoed back only when the caller supplied it. The upstream never generates one.
            X-Timestamp:
              schema:
                type: string
                format: date-time
              description: RFC 3339 instant the response was produced.
            Cache-Control:
              schema:
                type: string
              description: Always `private, no-store` -- this is customer-scoped data.
              example: private, no-store
        '429':
          description: Too Many Requests — the shared rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 0984d261-e0cd-4374-bcf0-1643d0d9b6ec
        description: A unique request identifier.
        example: 0984d261-e0cd-4374-bcf0-1643d0d9b6ec
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
        description: 1-based page number to return.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 500
          default: 50
        description: Items per page. Defaults to 50, maximum 500.
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:real:read
      - oauth2:
        - etoro-public:demo:read
      - oauth2:
        - etoro-public:real:write
      - oauth2:
        - etoro-public:demo:write
      - oauth2:
        - etoro-public:trade.real:read
      - oauth2:
        - etoro-public:trade.demo:read
      x-real-money: false
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
  /api/v1/data/stockback/promo-status:
    get:
      operationId: getStockbackPromoStatus
      tags:
      - Data
      summary: Get the caller's StockBack/Cashback promo status
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns the calling customer''s current StockBack/Cashback promo enrollment and lifetime USD reward figures - opted-in status, selected stock, professional-investor status, reward channel, club tier, country, this month''s expected reward, and lifetime StockBack/Cashback/total USD earned. This is user-scoped: the caller is identified by their own gateway-issued GCID, not a path or query parameter, so it always answers for ''me''. A customer who is not (or not yet) enrolled in the promo still returns 200, with every value field null, rather than 404 - a 404 means no row exists for this GCID at all, which is a data-completeness gap, not simply ''not enrolled''.'
      responses:
        '200':
          description: The caller's current StockBack/Cashback promo status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockbackPromoStatus'
              example:
                isOptedIn: true
                selectedStock: AAPL
                currentIsPi: false
                rewardChannel: stockback
                currentClub: Silver
                currentCountry: GB
