                    errorMessage: At least one scope name is required
                InvalidSubAccountId:
                  summary: Missing, malformed, or undecryptable x-sub-account-id header
                  value:
                    errorCode: InvalidSubAccountId
                    errorMessage: Invalid Sub Account Id
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden — a requested scope name is not allowed, or the sub-account is not owned by the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              examples:
                ScopeNameNotAllowed:
                  summary: A requested scope name is disallowed or unknown
                  value:
                    errorCode: ScopeNameNotAllowed
                    errorMessage: Scope name not allowed
                Forbidden:
                  summary: The sub-account's gcid does not match the caller's token gcid
                  value:
                    errorCode: Forbidden
                    errorMessage: Forbidden
        '409':
          description: Conflict — a user token with the requested name already exists for this sub-account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
