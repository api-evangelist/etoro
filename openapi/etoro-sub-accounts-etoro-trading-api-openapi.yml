    delete:
      tags:
      - Sub-Accounts - eToro Trading
      summary: Revoke Sub-Account User Token
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Revokes a sub-account user token. Revocation is idempotent, so revoking a token that does not exist also succeeds.'
      operationId: deleteSubAccountUserToken
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 70822444-9591-4f63-b1d6-5bcd3bf385fa
        description: A unique request identifier.
        example: 70822444-9591-4f63-b1d6-5bcd3bf385fa
      - name: userTokenId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The unique identifier of the user token to revoke.
      - name: x-sub-account-id
        in: header
        required: true
        schema:
          type: string
        description: The encrypted sub-account identifier. The backend validates that it decrypts to a sub-account owned by the caller's token gcid.
      responses:
        '204':
          description: User token revoked successfully (also returned when the token did not exist)
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad Request — missing, malformed, or undecryptable x-sub-account-id header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: InvalidSubAccountId
                errorMessage: Invalid Sub Account Id
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden — the sub-account's gcid does not match the caller's token gcid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: Forbidden
                errorMessage: Forbidden
        '429':
          description: Too Many Requests — a downstream dependency is throttling requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:sub-accounts:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
components:
  schemas:
    CreateSubAccountUserTokenRequest:
      type: object
      properties:
        userTokenName:
          type: string
          description: A friendly display name for the user token.
          example: my-trading-bot
        scopeNames:
          type: array
          items:
            type: string
          description: The scope names to assign. Must be a subset of the scopes returned by GET /api/v1/sub-accounts/etoro-trading/user-tokens/scopes.
          example:
          - etoro-public:trade.real:read
          - etoro-public:trade.real:write
        ipsWhitelist:
          type: array
          items:
            type: string
          description: An optional IPv4 whitelist for the token.
          example:
          - 192.168.1.1
        expiresAt:
          type: string
          format: date-time
          description: An optional UTC expiration for the token.
          example: '2026-12-31T23:59:59Z'
      required:
      - userTokenName
      - scopeNames
    UserTokenItem:
      type: object
      properties:
        userTokenId:
          type: string
          format: uuid
          description: The unique identifier of the user token.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        userTokenName:
          type: string
          description: The friendly display name assigned to the token.
          example: my-trading-bot
        clientId:
          type: string
          format: uuid
          description: The OAuth client identifier associated with the token.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        ipsWhitelist:
          type: array
          items:
            type: string
          description: The IPv4 addresses the token is restricted to, if any.
          example:
          - 192.168.1.1
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeNameItem'
          description: The scopes granted to the token.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The UTC expiration of the token, if one was set.
          example: '2026-12-31T23:59:59Z'
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
          description: When this user token was created, if known.
          example: '2026-06-06T10:15:00Z'
    UpdateSubAccountUserTokenRequest:
      type: object
      properties:
        scopeNames:
          type: array
          items:
            type: string
          description: The replacement scope names. When provided, must be a subset of the scopes returned by GET /api/v1/sub-accounts/etoro-trading/user-tokens/scopes.
          example:
          - etoro-public:trade.real:read
        ipsWhitelist:
          type: array
          items:
            type: string
          description: The replacement IPv4 whitelist.
          example:
          - 192.168.1.1
        expiresAt:
          type: string
          format: date-time
          description: The replacement UTC expiration.
          example: '2026-12-31T23:59:59Z'
    EtoroTradingSubAccountsOperationsApi_ErrorResponse:
      type: object
      properties:
        errorCode:
          type: string
        errorMessage:
          type: string
    ListUserTokensResponse:
      type: object
      properties:
        userTokens:
          type: array
          items:
            $ref: '#/components/schemas/UserTokenItem'
          description: The user's sub-account user tokens, across all their eToro trading sub-accounts.
    ScopeNameItem:
      type: object
      properties:
        name:
          type: string
          description: The permission scope name.
          example: etoro-public:trade.real:read
    EtoroTradingSubAccountsOperationsApi_CreateUserTokenResponse:
      type: object
      properties:
        userTokenId:
          type: string
          format: uuid
          description: The unique identifier of the created user token.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        userToken:
          type: string
          description: The secret token value. Returned only once, on creation.
          example: ut_live_9f8c7b6a5d4e3f2a1b0c
        userTokenName:
          type: string
          description: The friendly display name assigned to the token.
          example: my-trading-bot
        clientId:
          type: string
          format: uuid
          description: The OAuth client id associated with the token.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        ipsWhitelist:
          type: array
          items:
            type: string
          description: The IPv4 addresses the token is restricted to, if any.
          example:
          - 192.168.1.1
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeNameItem'
          description: The scopes granted to the token.
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The UTC expiration of the token, if one was set.
          example: '2026-12-31T23:59:59Z'
        createdAt:
          type: string
          format: date-time
          description: When this user token was created.
          example: '2026-06-06T10:15:00Z'
    EtoroTradingSubAccountsMoneyTransferRequest:
      type: object
      properties:
        amountInUsd:
          type: number
          description: The money-transfer amount in USD. Must be positive and have up to two decimal places.
          example: 250.55
        direction:
          type: string
          enum:
          - FromSubAccount
          - ToSubAccount
          description: The transfer direction. ToSubAccount moves funds from the caller to the sub-account; FromSubAccount moves funds from the sub-account back to the caller. Parsing is case-insensitive.
          example: ToSubAccount
      required:
      - amountInUsd
      - direction
    EtoroTradingSubAccountsOperationsApi_GetAllowedScopesResponse:
      type: object
      properties:
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/ScopeNameItem'
          description: The scope names that may be assigned to sub-account user tokens.
          example:
          - name: etoro-public:trade.real:read
          - name: etoro-public:trade.real:write
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key of the application. Only valid together with the x-user-key header — the pair is an alternative to OAuth bearer authentication, never sent alongside it. The pair is granted the same permissions the operation''s OAuth scopes describe.


        Demo credential for trying the API from these docs: `lhgfaslk21490FAScVPkdsb53F9dNkfHG4faZSG5vfjndfcfgdssdgsdHF4663`'
    userKeyAuth:
      type: apiKey
      in: header
      name: x-user-key
      description: 'User-specific authentication key. Only valid together with the x-api-key header — the pair is an alternative to OAuth bearer authentication, never sent alongside it.


        Demo credential for trying the API from these docs: `eyJlYW4iOiJVbnJlZ2lzdGVyZWRBcHBsaWNhdGlvbiIsImVrIjoiOE5sZ2cwcW5EUVdROUFNWGpXT2lmOWktZnpidG5KcUlqWGJ3WHJZZkpZcldrbG90ZEhvLVBjSWhQaU8xU1ZtMW84aU1WZGZqN2xWNzFjLXFxLmcybXE1dnh4Q1hUT25xaWRUaTFlcEhmVk1fIn0_`'
    oauth2:
      type: oauth2
      description: 'eToro OAuth2 — send the access token as `Authorization: Bearer <token>`. Each operation lists the scopes that grant access as separate `security` requirements (OpenAPI OR semantics): the caller''s token only needs ONE of them — you do NOT need all of them. Mutually exclusive with the x-api-key/x-user-key credential pair: never send both.'
