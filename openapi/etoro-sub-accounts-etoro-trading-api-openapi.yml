        limit: 60
        window: 60
        shared: true
        defaultPool: true
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 579b73d2-8159-49a0-9933-6a5915993f50
        description: A unique request identifier.
        example: 579b73d2-8159-49a0-9933-6a5915993f50
    post:
      tags:
      - Sub-Accounts - eToro Trading
      summary: Create Sub-Account User Token
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Generates a non-interactive user token for the sub-account identified by the x-sub-account-id header. The secret token value is returned only once, in this response.'
      operationId: createSubAccountUserToken
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: be4fa277-37ed-417d-8bfe-3a072da54f6e
        description: A unique request identifier.
        example: be4fa277-37ed-417d-8bfe-3a072da54f6e
      - name: x-sub-account-id
