openapi: 3.2.0
info:
  title: Sub-Accounts - eToro Trading API
  version: v1.395.0
  description: 'eToro’s public API provides access to real-time financial data, trading insights, and account management features, allowing developers to integrate eToro’s services into their applications. With access to market prices, historical data, and social trading information, the API empowers users to enhance their trading strategies. Designed for security and scalability, the eToro API ensures smooth and reliable integration for a variety of financial applications.


    For more details on integrating with eToro''s public WebSocket service, please refer to the dedicated WebSocket documentation.


    ## Authentication


    Every request must be authenticated with exactly one of two options: an OAuth 2.0 access token (`Authorization: Bearer `), or the non-interactive credential pair (`x-api-key` + `x-user-key` headers). The two options are mutually exclusive — a request carrying both is rejected. Each operation lists the OAuth scopes that grant access as alternative security requirements: a bearer token needs only ONE of them, and the same permissions govern the credential pair.'
servers:
- url: https://public-api.etoro.com
  description: eToro Public API
security:
- apiKeyAuth: []
  userKeyAuth: []
- oauth2: []
tags:
- name: Sub-Accounts - eToro Trading
paths:
  /api/v1/sub-accounts/etoro-trading/money-transfers:
    post:
      tags:
      - Sub-Accounts - eToro Trading
      summary: Create Sub-Account Money Transfer
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Executes a money transfer between the authenticated caller and the sub-account identified by the x-sub-account-id header. The amount must be positive with up to two decimal places. Direction ToSubAccount moves funds from the caller to the sub-account; FromSubAccount moves funds from the sub-account back to the caller.'
      operationId: createSubAccountMoneyTransfer
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 50b5e84a-6c0c-49b0-ab2a-5afbfbedff32
        description: A unique request identifier.
        example: 50b5e84a-6c0c-49b0-ab2a-5afbfbedff32
      - name: x-sub-account-id
        in: header
        required: true
        schema:
          type: string
        description: The encrypted sub-account identifier. The backend validates that it decrypts to a sub-account owned by the caller's token gcid and resolves the target compensation CID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EtoroTradingSubAccountsMoneyTransferRequest'
      responses:
        '200':
          description: The transfer was accepted
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              examples:
                RequestBodyIsRequired:
                  summary: Request body is missing
                  value:
                    errorCode: RequestBodyIsRequired
                    errorMessage: Request body is required
                InvalidSubAccountId:
                  summary: Missing, malformed, or undecryptable x-sub-account-id header
                  value:
                    errorCode: InvalidSubAccountId
                    errorMessage: Invalid Sub Account Id
                InvalidAmountInUsd:
                  summary: Amount is not positive or has more than two decimal places
                  value:
                    errorCode: InvalidAmountInUsd
                    errorMessage: AmountInUsd must be a positive number
                InvalidDirection:
                  summary: Direction is not a recognised value
                  value:
                    errorCode: InvalidDirection
                    errorMessage: Direction must be ToSubAccount, FromSubAccount, FromStsTokenCidToBodyCid, or FromBodyCidToStsTokenCid
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden — the sub-account's gcid does not match the caller's token gcid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: Forbidden
                errorMessage: Forbidden
        '429':
          description: Too Many Requests — the money-transfer dependency is throttling requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: MoneyTransferThrottled
                errorMessage: Money transfer is throttled
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal Server Error — the transfer could not be completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EtoroTradingSubAccountsOperationsApi_ErrorResponse'
              example:
                errorCode: MoneyTransferFailed
                errorMessage: Money transfer could not be completed
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:money:transfer
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
