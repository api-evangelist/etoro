openapi: 3.2.0
info:
  title: eToro Price Alerts API
  version: v1.395.0
  description: 'eToro’s public API provides access to real-time financial data, trading insights, and account management features, allowing developers to integrate eToro’s services into their applications. With access to market prices, historical data, and social trading information, the API empowers users to enhance their trading strategies. Designed for security and scalability, the eToro API ensures smooth and reliable integration for a variety of financial applications.


    For more details on integrating with eToro''s public WebSocket service, please refer to the dedicated WebSocket documentation.


    ## Authentication


    Every request must be authenticated with exactly one of two options: an OAuth 2.0 access token (`Authorization: Bearer `), or the non-interactive credential pair (`x-api-key` + `x-user-key` headers). The two options are mutually exclusive — a request carrying both is rejected. Each operation lists the OAuth scopes that grant access as alternative security requirements: a bearer token needs only ONE of them, and the same permissions govern the credential pair.'
servers:
- url: https://public-api.etoro.com
  description: eToro Public API
security:
- apiKeyAuth: []
  userKeyAuth: []
- oauth2: []
tags:
- name: Price Alerts
paths:
  /api/v1/price-alerts:
    get:
      operationId: getPriceAlerts
      tags:
      - Price Alerts
      summary: Get price alerts
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Returns all active price alerts for the authenticated user. Supports optional filtering by alertIds, instrumentIds, or symbols. The instrumentIds and symbols filters refer to the same dimension and are OR-combined with each other. The resulting instrument filter is AND-combined with alertIds. When no filters are provided, returns all active alerts.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: f6998ac7-1143-4271-a6ae-c1f0d2ab94a8
        description: A unique request identifier.
        example: f6998ac7-1143-4271-a6ae-c1f0d2ab94a8
      - name: alertIds
        in: query
        required: false
        description: Comma-separated list of alert IDs to filter by. AND-combined with the instrument filter when both are present.
        schema:
          type: string
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890,b2c3d4e5-f6a7-8901-bcde-f12345678901
      - name: instrumentIds
        in: query
        required: false
        description: Comma-separated list of instrument IDs to filter by. Treated as the same dimension as symbols — results matching either instrumentIds or symbols are returned.
        schema:
          type: string
        example: 1001,1002
      - name: symbols
        in: query
        required: false
        description: Comma-separated list of trading symbols to filter by. Treated as the same dimension as instrumentIds — results matching either symbols or instrumentIds are returned.
        schema:
          type: string
        example: AAPL,TSLA
      responses:
        '200':
          description: Successfully retrieved price alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertCollectionResponse'
              example:
                results:
                - alertId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  instrumentId: 1001
                  symbol: AAPL
                  targetPrice: 185.5
                  currentPrice: 182.3
                  createdAt: '2026-04-20T10:00:00Z'
                  updatedAt: '2026-04-25T14:30:00Z'
                - alertId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  instrumentId: 1002
                  symbol: TSLA
                  targetPrice: 250.0
                  currentPrice: 265.1
                  createdAt: '2026-04-22T08:15:00Z'
                  updatedAt: '2026-04-22T08:15:00Z'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Invalid filter parameters (e.g. malformed alertIds, instrumentIds, or unknown symbol)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_PARAMETER
                  message: Invalid request parameters
                  details: alertIds must be valid UUIDs
        '401':
          description: Unauthorized - missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: InsufficientPermissions
                errorMessage: Insufficient permissions to access this resource
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:price-alerts:read
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
    post:
      operationId: postPriceAlerts
      tags:
      - Price Alerts
      summary: Create a price alert
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Creates a new price alert for the authenticated user. The alert will fire when the market bid price reaches the target price. Provide a symbol to identify the instrument.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePriceAlertRequest'
            example:
              symbol: AAPL
              targetPrice: 185.5
      responses:
        '201':
          description: Price alert created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertMutationResponse'
              example:
                success: true
                data:
                  alertId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  instrumentId: 1001
                  symbol: AAPL
                  targetPrice: 185.5
                  currentPrice: 182.3
                  createdAt: '2026-04-30T10:00:00Z'
                  updatedAt: '2026-04-30T10:00:00Z'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Invalid request parameters (e.g. missing symbol, invalid targetPrice)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_PARAMETER
                  message: Invalid request parameters
                  details: Field 'targetPrice' must be greater than 0
                  field: targetPrice
        '401':
          description: Unauthorized - missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: InsufficientPermissions
                errorMessage: Insufficient permissions to access this resource
        '404':
          description: Instrument not found for the provided symbol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertErrorResponse'
              example:
                success: false
                error:
                  code: INSTRUMENT_NOT_FOUND
                  message: Instrument not found
                  details: No instrument found for symbol 'INVALID'
        '422':
          description: Business rule violation (e.g. duplicate alert, max alerts exceeded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertErrorResponse'
              example:
                success: false
                error:
                  code: MAX_ALERTS_EXCEEDED
                  message: Maximum number of alerts reached
                  details: You have reached the maximum number of active price alerts
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:price-alerts:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 93064707-9bb9-4e69-8ba8-3ae76c07a072
        description: A unique request identifier.
        example: 93064707-9bb9-4e69-8ba8-3ae76c07a072
  /api/v1/price-alerts/{alertId}:
    patch:
      operationId: patchPriceAlertsByAlertId
      tags:
      - Price Alerts
      summary: Update a price alert
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Updates the target price of an existing price alert.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 8ef5d9bd-6047-4884-98b5-29ae588e8e59
        description: A unique request identifier.
        example: 8ef5d9bd-6047-4884-98b5-29ae588e8e59
      - name: alertId
        in: path
        required: true
        description: Unique identifier of the price alert
        schema:
          type: string
          format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePriceAlertRequest'
            example:
              targetPrice: 190.0
      responses:
        '200':
          description: Price alert updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertMutationResponse'
              example:
                success: true
                data:
                  alertId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                  instrumentId: 1001
                  symbol: AAPL
                  targetPrice: 190.0
                  currentPrice: 182.3
                  createdAt: '2026-04-20T10:00:00Z'
                  updatedAt: '2026-04-30T11:00:00Z'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Invalid request parameters (e.g. invalid alertId format, missing targetPrice)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertErrorResponse'
              example:
                success: false
                error:
                  code: INVALID_PARAMETER
                  message: Invalid request parameters
                  details: Field 'targetPrice' must be greater than 0
                  field: targetPrice
        '401':
          description: Unauthorized - missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: InsufficientPermissions
                errorMessage: Insufficient permissions to access this resource
        '404':
          description: Price alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertErrorResponse'
              example:
                success: false
                error:
                  code: ALERT_NOT_FOUND
                  message: Price alert not found
                  details: No price alert found with the specified ID
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:price-alerts:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
    delete:
      operationId: deletePriceAlertsByAlertId
      tags:
      - Price Alerts
      summary: Delete a price alert
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Permanently deletes a price alert owned by the authenticated user.'
      parameters:
      - name: x-request-id
        in: header
        required: true
        schema:
          type: string
          format: uuid
          example: 70865f98-7a74-4a8e-926f-d58cca8372c2
        description: A unique request identifier.
        example: 70865f98-7a74-4a8e-926f-d58cca8372c2
      - name: alertId
        in: path
        required: true
        description: Unique identifier of the price alert to delete
        schema:
          type: string
          format: uuid
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
      responses:
        '200':
          description: Price alert deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePriceAlertResponse'
              example:
                success: true
                data:
                  alertId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '401':
          description: Unauthorized - missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: Unauthorized
                errorMessage: Unauthorized
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: InsufficientPermissions
                errorMessage: Insufficient permissions to access this resource
        '404':
          description: Price alert not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertErrorResponse'
              example:
                success: false
                error:
                  code: ALERT_NOT_FOUND
                  message: Price alert not found
                  details: No price alert found with the specified ID
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: TooManyRequests
                errorMessage: Too many requests
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
              example: 60
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertsApi_PublicErrorResponse'
              example:
                errorCode: UnhandledException
                errorMessage: Global Error
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:price-alerts:write
      x-ratelimit:
        limit: 60
        window: 60
        shared: true
        defaultPool: true
components:
  schemas:
    PriceAlert:
      type: object
      description: A price alert set by the user on a financial instrument
      required:
      - alertId
      - instrumentId
      - symbol
      - targetPrice
      - currentPrice
      - createdAt
      - updatedAt
      properties:
        alertId:
          type: string
          format: uuid
          description: Unique identifier of the price alert
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        instrumentId:
          type: integer
          description: Unique instrument identifier used across all trading operations
          example: 1001
        symbol:
          type: string
          description: Trading symbol displayed to users (e.g. AAPL, TSLA)
          example: AAPL
        targetPrice:
          type: number
          format: decimal
          description: Target price at which the alert will trigger
          example: 185.5
        currentPrice:
          type: number
          format: decimal
          description: Market bid price at the time the alert was created or last updated
          example: 182.3
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the alert was created (ISO 8601 UTC)
          example: '2026-04-20T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the alert was last updated (ISO 8601 UTC)
          example: '2026-04-25T14:30:00Z'
    DeletePriceAlertResponse:
      type: object
      description: Response for price alert delete operation
      properties:
        success:
          type: boolean
          description: Indicates the operation completed successfully
          example: true
        data:
          type: object
          properties:
            alertId:
              type: string
              format: uuid
              description: Unique identifier of the deleted price alert
              example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    UpdatePriceAlertRequest:
      type: object
      description: Request body for updating an existing price alert
      required:
      - targetPrice
      properties:
        targetPrice:
          type: number
          format: decimal
          description: New target price for the alert. Must be greater than 0.
          example: 190.0
          exclusiveMinimum: 0
    PriceAlertCollectionResponse:
      type: object
      description: Collection of price alerts for the authenticated user
      properties:
        results:
          type: array
          description: List of price alerts matching the query criteria
          items:
            $ref: '#/components/schemas/PriceAlert'
    PriceAlertsApi_PublicErrorResponse:
      type: object
      description: Standard error response from the public API gateway
      required:
      - errorCode
      - errorMessage
      properties:
        errorCode:
          type: string
          description: Machine-readable error code
          example: UnhandledException
        errorMessage:
          type: string
          description: Human-readable error message
          example: Global Error
    PriceAlertErrorResponse:
      type: object
      description: Error response from the price alerts service
      required:
      - success
      - error
      properties:
        success:
          type: boolean
          description: Indicates the request failed
          example: false
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Machine-readable error code for programmatic handling
              example: VALIDATION_ERROR
            message:
              type: string
              description: Human-readable error message
              example: Invalid request parameters
            details:
              type: string
              description: Additional context about the error
              example: Field 'targetPrice' must be greater than 0
            field:
              type: string
              description: The specific field that caused the error (if applicable)
              example: targetPrice
    PriceAlertMutationResponse:
      type: object
      description: Response for price alert create and update operations
      properties:
        success:
          type: boolean
          description: Indicates the operation completed successfully
          example: true
        data:
          $ref: '#/components/schemas/PriceAlert'
    CreatePriceAlertRequest:
      type: object
      description: Request body for creating a new price alert
      required:
      - symbol
      - targetPrice
      properties:
        symbol:
          type: string
          description: Trading symbol to identify the instrument (e.g. AAPL, TSLA)
          example: AAPL
        targetPrice:
          type: number
          format: decimal
          description: Target price at which the alert should trigger. Must be greater than 0.
          example: 185.5
          exclusiveMinimum: 0
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key of the application. Only valid together with the x-user-key header — the pair is an alternative to OAuth bearer authentication, never sent alongside it. The pair is granted the same permissions the operation''s OAuth scopes describe.


        Demo credential for trying the API from these docs: `lhgfaslk21490FAScVPkdsb53F9dNkfHG4faZSG5vfjndfcfgdssdgsdHF4663`'
    userKeyAuth:
