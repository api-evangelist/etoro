  /api/v1/money/transfers:
    post:
      tags:
      - Transfer
      summary: Execute an internal account-to-account transfer
      description: '**Rate limit:** 60 requests per 60 seconds. This is the **default shared quota** — it is shared with every other endpoint that has no dedicated limit, so requests across those endpoints all draw from the same budget.


        ---


        Executes an internal transfer from the source account to the destination account for the authenticated customer.'
      operationId: postMoneyTransfer
      security:
      - apiKeyAuth: []
        userKeyAuth: []
      - oauth2:
        - etoro-public:money.transfer:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoneyTransferRequest'
      responses:
        '200':
          description: Transfer accepted; returns transfer id and optional echoed request reference id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MoneyTransferResponse'
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
                type: integer
              example: 60
            RateLimit-Remaining:
              description: Requests remaining in the current window for this quota.
              schema:
                type: integer
            RateLimit-Reset:
              description: Seconds until the current window resets.
              schema:
                type: integer
            RateLimit-Policy:
              description: Quota policy in the form `<limit>;w=<window-seconds>`.
              schema:
                type: string
              example: 60;w=60
        '400':
          description: Validation error (accounts, amount, currency, or route).
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: Conflict (e.g. idempotency / duplicate request reference per policy)
        '500':
          description: Server error
        '429':
          description: Too Many Requests — the shared rate limit (60 requests / 60s) was exceeded.
          headers:
            RateLimit-Limit:
              description: Maximum number of requests allowed per window. This is the default shared pool used by every endpoint without a dedicated limit, so it is NOT per-endpoint — requests across those endpoints all draw from this one budget.
              schema:
